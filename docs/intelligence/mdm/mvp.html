<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreTX MDM — la consola del maestro</title>
<style>/* Los tokens del design system de Traxion, copiados de
   node_modules/@traxion-global/design-system/dist/theme.css.

   Se copian en vez de importarse porque el paquete es privado y este archivo no pide nada a
   la red. Si el design system cambia sus tokens, esto se queda atrás — es un corte con
   fecha, y lo dice en el pie. */
:root{
  --background:0 0% 100%; --foreground:0 0% 10%;
  --card:0 0% 100%;
  --primary:64 100% 44%; --primary-light:62 80% 56%; --primary-dark:63 100% 37%;
  --primary-foreground:214 3% 25%;
  --secondary:214 3% 40%; --secondary-light:60 2% 81%; --secondary-medium:210 2% 60%;
  --muted:0 0% 96.1%; --muted-foreground:0 0% 45.1%;
  --destructive:3 55.8% 51.2%; --destructive-warm:12 100% 56.7%;
  --border:0 0% 89.8%; --ring:65 100% 41%;
  --radius:.5rem;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:hsl(var(--background)); color:hsl(var(--foreground));
  font-family:Roboto,"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; line-height:1.25; font-weight:600; letter-spacing:-.01em}
h1{font-size:1.5rem} h2{font-size:1.0625rem} h3{font-size:.9375rem}
p{margin:0}
a{color:inherit; text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.apagado{color:hsl(var(--muted-foreground))}
.chico{font-size:.8125rem}
.fuerte{font-weight:600}
.trunca{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ------------------------------------------------------------------ armazón */
.marco{display:flex; flex-direction:column; min-height:100%}
.cabecera{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:1rem;
  height:3.25rem; padding:0 1rem; background:hsl(var(--background));
  border-bottom:1px solid hsl(var(--border));
}
.marca{display:flex; align-items:center; gap:.55rem; font-weight:700; letter-spacing:-.02em; white-space:nowrap}
.marca svg{color:hsl(var(--primary-dark))}
.etiqueta{
  padding:.1rem .5rem; border:1px solid hsl(var(--border)); border-radius:99px;
  font-size:.6875rem; font-weight:500; color:hsl(var(--muted-foreground));
}
.cabecera .relleno{flex:1}
.usuario{
  display:flex; align-items:center; gap:.6rem; padding:.3rem .5rem .3rem .35rem;
  border:1px solid hsl(var(--border)); border-radius:99px; cursor:pointer; background:none;
  font:inherit; color:inherit;
}
.usuario:hover{background:hsl(var(--muted))}
.avatar{
  width:1.75rem; height:1.75rem; border-radius:99px; background:hsl(var(--primary));
  color:hsl(var(--primary-foreground)); display:grid; place-items:center;
  font-size:.6875rem; font-weight:700;
}
.rol{
  padding:.05rem .5rem; border-radius:99px; background:hsl(var(--primary)/.25);
  color:hsl(var(--primary-foreground)); font-size:.625rem; font-weight:700; letter-spacing:.04em;
}
.cuerpo{display:flex; flex:1; min-height:0}
.lateral{
  width:14.5rem; flex-shrink:0; border-right:1px solid hsl(var(--border));
  padding:1rem .75rem; display:flex; flex-direction:column; gap:.15rem;
}
.lateral a{
  display:flex; align-items:center; gap:.6rem; padding:.6rem .75rem; border-radius:.375rem;
  color:hsl(var(--muted-foreground)); font-weight:500;
}
.lateral a:hover{background:hsl(var(--muted)); color:hsl(var(--foreground))}
.lateral a.activa{background:hsl(var(--secondary)); color:#fff}
.lateral .nota{margin-top:auto; padding:.75rem; font-size:.75rem; color:hsl(var(--muted-foreground)); border-top:1px solid hsl(var(--border))}
.pagina{flex:1; min-width:0; padding:1.5rem 1.75rem 4rem}
.pagina > * + *{margin-top:1.5rem}
@media(max-width:860px){
  .lateral{display:none}
  .pagina{padding:1rem}
  .lateral.abierta{
    display:flex; position:fixed; inset:3.25rem auto 0 0; z-index:40;
    background:hsl(var(--background)); box-shadow:0 0 0 100vmax hsl(0 0% 0%/.3);
  }
}
.menu-movil{display:none; background:none; border:none; cursor:pointer; color:inherit; padding:.25rem}
@media(max-width:860px){ .menu-movil{display:block} }

/* ------------------------------------------------------------------ bloques */
.respuesta{
  border-top:1px solid hsl(var(--border)); border-bottom:1px solid hsl(var(--border));
  padding:1rem 0; font-size:1.0625rem; line-height:1.45;
}
.seccion > .titulo{
  display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between;
  gap:.75rem; margin-bottom:.75rem;
}
.rejilla{display:grid; gap:1rem}
.rejilla.dos{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tarjeta{border:1px solid hsl(var(--border)); border-radius:var(--radius); padding:1rem 1.25rem}
.vacio{
  border:1px dashed hsl(var(--border)); border-radius:var(--radius);
  padding:2.5rem 1.5rem; text-align:center;
}
.vacio h3{margin-bottom:.35rem}
.aviso{
  border-left:3px solid hsl(var(--destructive-warm)); background:hsl(var(--destructive-warm)/.08);
  padding:.85rem 1.1rem; border-radius:0 .375rem .375rem 0; font-size:.875rem;
}
.filtros{display:grid; gap:.75rem; grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.campo{display:flex; flex-direction:column; gap:.3rem}
label{font-size:.8125rem; font-weight:500}

/* ------------------------------------------------------------------ controles */
input,select,button{font:inherit; color:inherit}
input[type=text],input[type=number],select{
  width:100%; padding:.45rem .6rem; border:1px solid hsl(var(--border)); border-radius:.375rem;
  background:hsl(var(--background)); font-size:.875rem;
}
input[type=number]{font-variant-numeric:tabular-nums; min-width:5.5rem}
input:focus,select:focus{outline:2px solid hsl(var(--ring)); outline-offset:-1px}
input[aria-invalid=true]{border-color:hsl(var(--destructive)); background:hsl(var(--destructive)/.05)}
.boton{
  display:inline-flex; align-items:center; gap:.4rem; justify-content:center;
  padding:.5rem 1rem; border-radius:.375rem; border:1px solid transparent; cursor:pointer;
  font-size:.875rem; font-weight:600; background:hsl(var(--primary)); color:hsl(var(--primary-foreground));
  white-space:nowrap;
}
.boton:hover{background:hsl(var(--primary-dark)); color:#fff}
.boton.borde{background:none; border-color:hsl(var(--border)); font-weight:500}
.boton.borde:hover{background:hsl(var(--muted)); color:inherit}
.boton.plano{background:none; border-color:transparent; color:hsl(var(--secondary)); padding:.35rem .5rem; font-weight:500}
.boton.plano:hover{background:hsl(var(--muted)); color:inherit}
.boton.chico{padding:.3rem .65rem; font-size:.8125rem}
.boton:disabled{opacity:.45; cursor:not-allowed}
.boton.peligro{background:none; border-color:hsl(var(--destructive)/.4); color:hsl(var(--destructive))}
.boton.peligro:hover{background:hsl(var(--destructive)/.08); color:hsl(var(--destructive))}

/* ------------------------------------------------------------------ tablas */
.desliza{overflow-x:auto; border:1px solid hsl(var(--border)); border-radius:var(--radius)}
table{border-collapse:collapse; width:100%; font-size:.875rem}
th,td{text-align:left; padding:.6rem .8rem; border-bottom:1px solid hsl(var(--border)); vertical-align:middle}
th{
  font-size:.6875rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  color:hsl(var(--muted-foreground)); white-space:nowrap; background:hsl(var(--muted)/.6);
}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:hsl(var(--muted)/.5)}
td.der,th.der{text-align:right}
td.cen,th.cen{text-align:center}
.pegada{position:sticky; left:0; background:hsl(var(--background))}
tr:hover .pegada{background:hsl(var(--muted)/.5)}

/* ------------------------------------------------------------------ señales */
.insignia{display:inline-block; padding:.12rem .55rem; border-radius:99px; font-size:.75rem; font-weight:600; white-space:nowrap}
.i-completa{background:hsl(var(--primary)/.25); color:hsl(var(--primary-foreground))}
.i-casi{color:hsl(var(--muted-foreground))}
.i-parcial{background:hsl(var(--destructive-warm)/.15); color:hsl(var(--destructive-warm))}
.i-nada{background:hsl(var(--destructive)/.13); color:hsl(var(--destructive))}
.i-gris{background:hsl(var(--muted)); color:hsl(var(--muted-foreground))}
.i-azul{background:hsl(var(--secondary)/.12); color:hsl(var(--secondary))}
.marca-sem{
  display:inline-flex; align-items:center; justify-content:center; width:2.4rem; height:1.6rem;
  border-radius:.25rem; font-size:.6875rem; font-variant-numeric:tabular-nums;
}
.barra{height:7px; background:hsl(var(--muted)); border-radius:99px; overflow:hidden; min-width:6rem}
.barra i{display:block; height:100%; background:hsl(var(--primary-dark)); border-radius:99px}
.reloj{display:inline-flex; align-items:center; gap:.35rem; font-size:.8125rem; white-space:nowrap}
.urgente{color:hsl(var(--destructive))}
.pronto{color:hsl(var(--destructive-warm))}
.error{display:block; color:hsl(var(--destructive)); font-size:.75rem; margin-top:.25rem; max-width:26rem; line-height:1.35}
.escala{color:hsl(var(--destructive-warm))}

/* ------------------------------------------------------------------ matriz */
.bloque{border:1px solid hsl(var(--border)); border-radius:var(--radius); overflow:hidden}
.bloque > .barra-titulo{
  display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; justify-content:space-between;
  padding:.75rem 1rem; background:hsl(var(--muted)/.6); border-bottom:1px solid hsl(var(--border));
}
.bloque .pie{
  display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; justify-content:space-between;
  padding:.85rem 1rem; border-top:1px solid hsl(var(--border));
}
.resultado{font-weight:600; font-variant-numeric:tabular-nums}
.resultado.sin{color:hsl(var(--muted-foreground)); font-weight:400}
.veredicto{padding:.85rem 1rem; border-top:1px solid hsl(var(--border)); font-size:.875rem}
.veredicto.ok{background:hsl(var(--primary)/.12)}
.veredicto.mal{background:hsl(var(--destructive)/.07)}
.veredicto.retiene{background:hsl(var(--destructive-warm)/.1)}
details{border:1px solid hsl(var(--border)); border-radius:var(--radius)}
summary{padding:.75rem 1rem; cursor:pointer; font-weight:500; font-size:.875rem}
summary:hover{background:hsl(var(--muted)/.5)}
details[open] summary{border-bottom:1px solid hsl(var(--border))}

/* ------------------------------------------------------------------ pestañas */
.pestanas{display:flex; gap:.25rem; overflow-x:auto; border-bottom:1px solid hsl(var(--border))}
.pestanas button{
  background:none; border:none; border-bottom:2px solid transparent; cursor:pointer;
  padding:.6rem .85rem; font-size:.875rem; font-weight:500; color:hsl(var(--muted-foreground));
  white-space:nowrap;
}
.pestanas button:hover{color:hsl(var(--foreground))}
.pestanas button.activa{color:hsl(var(--foreground)); border-bottom-color:hsl(var(--primary))}

/* ------------------------------------------------------------------ gráfica */
.grafica{width:100%; height:230px}
.grafica .eje{stroke:hsl(var(--border))}
.grafica .linea{fill:none; stroke:hsl(var(--primary-dark)); stroke-width:2}
.grafica .punto{fill:hsl(var(--primary-dark))}
.grafica text{font-size:10px; fill:hsl(var(--muted-foreground))}
.duelo{display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.duelo b{display:block; font-size:1.75rem; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------------ MDM: el árbol */
.arbol{list-style:none; margin:0; padding:0}
.arbol ul{list-style:none; margin:0; padding-left:1.4rem; border-left:1px solid hsl(var(--border))}
.nodo{display:flex; align-items:center; gap:.5rem; padding:.45rem .5rem; border-radius:.375rem; cursor:pointer; flex-wrap:wrap}
.nodo:hover{background:hsl(var(--muted)/.6)}
.nodo .flecha{width:1rem; text-align:center; color:hsl(var(--muted-foreground)); flex-shrink:0; transition:transform .12s}
.nodo.abierto .flecha{transform:rotate(90deg)}
.nodo .conteo{margin-left:auto; display:flex; gap:.4rem; align-items:center}
.hoja{display:flex; align-items:center; gap:.5rem; padding:.3rem .5rem .3rem 1.5rem; flex-wrap:wrap}
.hoja:hover{background:hsl(var(--muted)/.4)}

/* MDM: tarjetas del tablero de calidad */
.calidad{display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.hueco-tarjeta{border:1px solid hsl(var(--border)); border-left:3px solid hsl(var(--destructive-warm)); border-radius:var(--radius); padding:1rem 1.15rem; cursor:pointer; background:none; text-align:left; font:inherit; color:inherit}
.hueco-tarjeta:hover{background:hsl(var(--muted)/.5)}
.hueco-tarjeta.cerrado{border-left-color:hsl(var(--primary))}
.hueco-tarjeta b{display:block; font-size:1.75rem; font-weight:700; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums}
.hueco-tarjeta small{display:block; margin-top:.3rem; font-size:.8125rem; color:hsl(var(--muted-foreground)); line-height:1.35}
.hueco-tarjeta .cierra{margin-top:.5rem; font-size:.6875rem; letter-spacing:.05em; text-transform:uppercase; color:hsl(var(--muted-foreground))}

/* ------------------------------------------------------------------ MDM: el diagrama del modelo */
.diagrama{border:1px solid hsl(var(--border)); border-radius:var(--radius); padding:.5rem; background:hsl(var(--muted)/.3)}
.diagrama svg{width:100%; height:auto; display:block}
.diagrama .caja{cursor:pointer}
.diagrama .caja rect{fill:hsl(var(--background)); stroke:hsl(var(--border)); rx:8}
.diagrama .caja:hover rect{stroke:hsl(var(--primary-dark)); stroke-width:2}
.diagrama .caja.centro rect{fill:hsl(var(--primary)/.18); stroke:hsl(var(--primary-dark)); stroke-width:2}
.diagrama .caja text{fill:hsl(var(--foreground))}
.diagrama .caja .nombre{font-size:13px; font-weight:600}
.diagrama .caja.centro .nombre{font-size:15px}
.diagrama .caja .cuenta{font-size:18px; font-weight:700; letter-spacing:-.02em}
.diagrama .caja .nota{font-size:9.5px; fill:hsl(var(--muted-foreground))}
.diagrama .caja .nota.alerta{fill:hsl(var(--destructive-warm)); font-weight:600}
.diagrama .flecha-linea{stroke:hsl(var(--secondary-medium)); stroke-width:1.5; fill:none; marker-end:url(#punta)}
.diagrama .verbo{font-size:9.5px; fill:hsl(var(--muted-foreground)); font-style:italic}
.diagrama-lista{display:none}
@media(max-width:700px){
  .diagrama svg{display:none}
  .diagrama-lista{display:grid; gap:.5rem; padding:.5rem}
}

/* MDM: la cadena de una ficha */
.cadena{list-style:none; margin:0; padding:0}
.cadena > li{position:relative; padding:0 0 1.1rem 1.9rem}
.cadena > li::before{ /* el punto */
  content:""; position:absolute; left:.35rem; top:.45rem; width:.7rem; height:.7rem;
  border-radius:99px; background:hsl(var(--primary)); border:2px solid hsl(var(--primary-dark));
}
.cadena > li::after{ /* la línea que conecta */
  content:""; position:absolute; left:.65rem; top:1.3rem; bottom:-.1rem; width:2px;
  background:hsl(var(--border));
}
.cadena > li:last-child::after{display:none}
.cadena .eslabon{border:1px solid hsl(var(--border)); border-radius:var(--radius); padding:.85rem 1.1rem}
.cadena .eslabon .rotulo-eslabon{
  font-size:.6875rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  color:hsl(var(--muted-foreground)); margin-bottom:.35rem; display:flex; gap:.6rem; align-items:center;
}
.cadena .eslabon .rotulo-eslabon a{margin-left:auto; font-weight:500; text-transform:none; letter-spacing:0; color:hsl(var(--secondary))}
.cadena .eslabon .rotulo-eslabon a:hover{text-decoration:underline}
.fichitas{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.4rem}
.fichita{
  display:inline-flex; align-items:center; gap:.35rem; padding:.25rem .6rem;
  border:1px solid hsl(var(--border)); border-radius:.375rem; font-size:.8125rem;
  text-decoration:none; background:hsl(var(--background));
}
a.fichita:hover{border-color:hsl(var(--primary-dark)); background:hsl(var(--muted)/.5)}
.fichita b{font-weight:600}

/* MDM: el mini-mapa contextual */
.minimapa{display:flex; align-items:center; gap:0; flex-wrap:wrap; margin:0 0 .25rem}
.minimapa span{
  padding:.2rem .6rem; border:1px solid hsl(var(--border)); border-radius:99px;
  font-size:.6875rem; color:hsl(var(--muted-foreground)); background:hsl(var(--background));
}
.minimapa span.activo{
  border-color:hsl(var(--primary-dark)); background:hsl(var(--primary)/.18);
  color:hsl(var(--foreground)); font-weight:600;
}
.minimapa i{width:1rem; height:2px; background:hsl(var(--border)); flex-shrink:0}
</style>
</head>

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
function ico(nombre, alto = 16) {
  return `<svg width="${alto}" height="${alto}" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true" style="flex-shrink:0">${ICONOS[nombre] || ""}</svg>`;
}
const n0 = (x) => x.toLocaleString("es-MX", { maximumFractionDigits: 0 });

/** La insignia de origen: se pinta desde el dato. EJEMPLO y DERIVADO nunca se disfrazan. */
function origen(o, estado) {
  if (o === "EJEMPLO") return `<span class="insignia i-parcial">EJEMPLO</span>`;
  if (o === "DERIVADO") {
    return estado === "CONFIRMADO"
      ? `<span class="insignia i-completa">confirmado</span>`
      : `<span class="insignia i-azul">derivado · por confirmar</span>`;
  }
  if (o === "SEMILLA") return `<span class="insignia i-gris">semilla</span>`;
  return `<span class="insignia i-completa">manual</span>`;
}

function derivar() {
  const m = S.m;
  const opPorId = new Map(m.operaciones.map((o) => [o.id, o]));
  const ciaPorId = new Map(m.companias.map((c) => [c.id, c]));
  const negPorId = new Map(m.negocios.map((n) => [n.id, n]));
  const terPorId = new Map(m.territorios.map((t) => [t.id, t]));
  const cliPorId = new Map(m.clientes.map((c) => [c.id, c]));
  const indPorId = new Map(m.indicadores.map((i) => [i.id, i]));

  // Cuántos indicadores SEMANALES cubren cada operación — el peso de la captura semanal.
  const semanalesDe = new Map();
  for (const [indId, ops] of Object.entries(m.alcances)) {
    if (indPorId.get(indId).frecuencia !== "Semanal") continue;
    for (const op of ops) semanalesDe.set(op, (semanalesDe.get(op) || 0) + 1);
  }

  // La carga por persona: responsable × sus operaciones × semanales que las cubren.
  const carga = m.responsables.map((r) => ({
    ...r,
    envios: r.operaciones.reduce((t, op) => t + (semanalesDe.get(op) || 0), 0),
  })).sort((a, b) => b.envios - a.envios);

  // Huecos vivos (se recalculan: confirmar un cliente o clasificar un lote los mueve).
  const h = m.huecos;
  const huecos = {
    ...h,
    operaciones_sin_clase: m.operaciones.filter((o) => o.clase === null).length,
    clientes_por_confirmar: m.clientes.filter((c) => c.estado === "POR_CONFIRMAR").length,
    contratos_de_ejemplo: m.contratos.filter((c) => c.estado === "EJEMPLO").length,
    negocios_sin_clase: m.negocios.filter((n) => n.clase === null).length,
    indicadores_sin_conexion: m.origenes.filter((o) => o.estadoConexion === "PENDIENTE").length,
  };

  // Índices inversos: son los que permiten recorrer una relación desde cualquier punta —
  // la ficha de una operación necesita llegar a su cliente, su contrato, sus indicadores
  // y su responsable sin recorrer las listas cada vez.
  const contratoDeCliente = new Map(m.contratos.map((ct) => [ct.clienteId, ct]));
  const clientesDeOperacion = new Map();
  for (const c of m.clientes) {
    for (const op of c.operaciones) {
      const lista = clientesDeOperacion.get(op) || [];
      lista.push(c);
      clientesDeOperacion.set(op, lista);
    }
  }
  const responsableDeOperacion = new Map();
  for (const r of m.responsables) {
    for (const op of r.operaciones) responsableDeOperacion.set(op, r);
  }
  const indicadoresDeOperacion = new Map();
  for (const [indId, ops] of Object.entries(m.alcances)) {
    for (const op of ops) {
      const lista = indicadoresDeOperacion.get(op) || [];
      lista.push(indId);
      indicadoresDeOperacion.set(op, lista);
    }
  }
  const origenDeIndicador = new Map(m.origenes.map((o) => [o.indicadorId, o]));
  const alcanceTotal = Object.values(m.alcances).reduce((t, l) => t + l.length, 0);

  return { opPorId, ciaPorId, negPorId, terPorId, cliPorId, indPorId, semanalesDe, carga, huecos,
           contratoDeCliente, clientesDeOperacion, responsableDeOperacion,
           indicadoresDeOperacion, origenDeIndicador, alcanceTotal };
}

const RUTAS = [
  { via: "/", etiqueta: "El modelo", icono: "clipboard-list" },
  { via: "/panorama", etiqueta: "Panorama", icono: "building-2" },
  { via: "/clientes", etiqueta: "Clientes y contratos", icono: "users" },
  { via: "/indicadores", etiqueta: "Indicadores y origen", icono: "trending-up" },
  { via: "/personas", etiqueta: "Personas", icono: "users" },
  { via: "/calidad", etiqueta: "Calidad del maestro", icono: "gauge" },
];

function rutaActual() {
  const bruta = (location.hash || "#/").slice(1);
  return bruta.startsWith("/") ? bruta : "/" + bruta;
}

function pintar() {
  const D = derivar();
  const via = rutaActual();
  const scroll = window.scrollY;

  document.getElementById("raiz").innerHTML = `
    <div class="marco">
      <header class="cabecera">
        <span class="marca">${ico("clipboard-list", 18)} CoreTX MDM</span>
        <span class="etiqueta">Maestro de datos · demostración</span>
        <span class="relleno"></span>
        <span class="usuario" style="cursor:default">
          <span class="avatar">AM</span>
          <span class="chico fuerte">Administración del maestro</span>
          <span class="rol">ADMINISTRA</span>
        </span>
      </header>
      <div class="cuerpo">
        <nav class="lateral">
          ${RUTAS.map((r) => {
            const activa = r.via === "/" ? via === "/" : via.startsWith(r.via);
            return `<a href="#${r.via}" class="${activa ? "activa" : ""}">${ico(r.icono)} ${esc(r.etiqueta)}</a>`;
          }).join("")}
          <p class="nota">Todo escribe en memoria; al recargar vuelve al maestro derivado.
          Los datos reales son ${S.m.operaciones.length} operaciones de la semilla.</p>
        </nav>
        <main class="pagina">${pantalla(via, D)}</main>
      </div>
    </div>`;

  window.scrollTo(0, scroll);
}

function pantalla(via, D) {
  if (via === "/") return modelo(D);
  if (via === "/calidad") return calidad(D);
  if (via === "/panorama") return panorama(D);
  if (via.startsWith("/operacion/")) return fichaOperacion(via.slice("/operacion/".length), D);
  if (via.startsWith("/cliente/")) return fichaCliente(via.slice("/cliente/".length), D);
  if (via === "/clientes") return clientes(D);
  if (via === "/indicadores") return indicadores(D);
  if (via === "/personas") return personas(D);
  return `<h1>No existe esa pantalla</h1><p class="apagado"><a href="#/" class="fuerte">Volver al modelo</a></p>`;
}

/** El mini-mapa contextual: dónde está esta pantalla dentro del modelo. */
function miniMapa(eslabones, activo) {
  return `<div class="minimapa" aria-label="Dónde está esta pantalla en el modelo">
    ${eslabones.map((e, i) =>
      (i ? "<i></i>" : "") + `<span class="${e === activo ? "activo" : ""}">${esc(e)}</span>`
    ).join("")}
  </div>`;
}

function seccion(titulo, nota, contenido) {
  return `<section class="seccion">
    <div class="titulo"><h2>${titulo}</h2>${nota ? `<span class="chico apagado">${nota}</span>` : ""}</div>
    ${contenido}</section>`;
}

/* ============================================================== 0 · el modelo */

/** La pantalla de entrada: **el modelo dibujado**, con la operación al centro — todo se
 *  conecta a través de ella. Los conteos salen de los datos, no de texto escrito: si se
 *  confirma un cliente o se conecta un indicador, el diagrama cambia. Cada caja navega. */
// Las nueve llaves que la pantalla de calidad enseña como tarjetas. El modelo cuenta las
// mismas: dos cuentas paralelas de «huecos abiertos» terminarían diciendo cosas distintas.
const HUECOS_VISIBLES = [
  "operaciones_sin_clase", "clientes_por_confirmar", "contratos_de_ejemplo",
  "indicadores_sin_conexion", "operaciones_sin_cliente_derivable",

      ${nota ? `<text class="nota ${opciones.alerta ? "alerta" : ""}" x="${x + 12}" y="${y + h - 10}">${esc(nota)}</text>` : ""}
    </g>`;

  const flecha = (d, verbo, vx, vy, ancla = "middle") => `
    <path class="flecha-linea" d="${d}"/>
    ${verbo ? `<text class="verbo" x="${vx}" y="${vy}" text-anchor="${ancla}">${esc(verbo)}</text>` : ""}`;

  const svg = `
  <svg viewBox="0 0 860 470" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="El modelo del maestro: la operación al centro y sus cinco relaciones">
    <defs><marker id="punta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="hsl(var(--secondary-medium))"/>
    </marker></defs>

    <!-- BLOQUE A · la estructura, a la izquierda -->
    ${caja(20, 20, 175, 52, "División", 1, "Logística", "#/panorama")}
    ${flecha("M107,72 L107,96", "agrupa", 122, 88, "start")}
    ${caja(20, 96, 175, 52, "Compañía", m.companias.length, "9 razones sociales", "#/panorama")}
    ${caja(20, 190, 175, 52, "Negocio", m.negocios.length, D.huecos.negocios_sin_clase ? "sin clase todavía" : "clasificados", "#/panorama", { alerta: D.huecos.negocios_sin_clase > 0 })}
    ${caja(20, 284, 175, 52, "Territorio", m.territorios.length, "derivado · sólo SID", "#/panorama", { alerta: true })}
    ${flecha("M195,122 C280,122 290,175 348,192", "opera", 268, 130)}
    ${flecha("M195,216 L348,216", "clasifica", 268, 208)}
    ${flecha("M195,310 C280,310 290,255 348,238", "ubica", 268, 302)}

    <!-- BLOQUE A · cliente y contrato, abajo -->
    ${caja(20, 396, 175, 54, "Cliente", m.clientes.length, "derivado · por confirmar", "#/clientes", { alerta: true })}
    ${flecha("M195,423 L280,423", "firma", 237, 415)}
    ${caja(280, 396, 175, 54, "Contrato", m.contratos.length, "EJEMPLO — sin dato real", "#/clientes", { alerta: true })}
    ${flecha("M455,423 C520,423 430,290 424,262", "se sirve desde", 508, 380, "start")}

    <!-- EL EJE -->
    ${caja(348, 168, 152, 94, "OPERACIÓN", m.operaciones.length, "el eje: todo pasa por aquí", "#/panorama", { centro: true })}

    <!-- BLOQUE B · indicadores, a la derecha -->
    ${caja(665, 20, 175, 52, "Indicador", m.indicadores.length, "tipo y sentido, sin firmar", "#/indicadores", { alerta: true })}
    ${flecha("M752,72 L752,110", "se mide sobre", 764, 96, "start")}
    ${caja(665, 110, 175, 64, "Alcance", n0(D.alcanceTotal), "genera los esperados", "#/indicadores")}
    ${flecha("M665,150 C580,160 560,190 500,198", "", 0, 0)}
    ${caja(665, 212, 175, 64, "Origen del dato", m.origenes.filter((o) => o.canal === "MANUAL").length + " manual", "el canal: Captura o conector", "#/indicadores")}
    ${flecha("M665,244 C580,240 560,225 500,220", "", 0, 0)}

    <!-- BLOQUE C · personas -->
    ${caja(665, 340, 175, 54, "Persona", D.carga.length, "contactos ≠ asignación", "#/personas", { alerta: true })}
    ${flecha("M665,364 C560,360 470,300 438,262", "captura", 560, 342)}
  </svg>`;

  // Bajo 700 px el SVG se esconde y el mismo dato sale como lista de cajas (CSS).
  const lista = [
    ["División · Compañía", `1 · ${m.companias.length}`, "#/panorama"],
    ["Negocio · Territorio", `${m.negocios.length} · ${m.territorios.length} derivados`, "#/panorama"],
    ["OPERACIÓN — el eje", m.operaciones.length, "#/panorama"],
    ["Cliente → Contrato", `${m.clientes.length} por confirmar → ${m.contratos.length} EJEMPLO`, "#/clientes"],
    ["Indicador → Alcance", `${m.indicadores.length} → ${n0(D.alcanceTotal)} renglones`, "#/indicadores"],
    ["Persona (captura)", D.carga.length, "#/personas"],
  ].map(([nombre, cuenta, destino]) =>
    `<button class="hueco-tarjeta cerrado" data-accion="ir" data-a="${destino}">
       <b class="num">${esc(String(cuenta))}</b><small><strong style="color:hsl(var(--foreground))">${esc(nombre)}</strong></small>
     </button>`).join("");

  return `
    <h1>El modelo</h1>

    ${seccion("Recorrer un ejemplo real", "la relación completa de un registro concreto", `
      <div class="rejilla dos">
        <a class="tarjeta" href="#/operacion/S011" style="text-decoration:none">

          misma cadena, con el hueco dicho donde va.</p>
        </a>

}

/* ============================================================== fichas */

/** La ficha de una operación: **la cadena completa de un registro**, eslabón por eslabón.
 *  Un caso concreto explica el modelo mejor que cinco tablas. */
function fichaOperacion(id, D) {
  const o = D.opPorId.get(id);
  if (!o) return `<h1>No existe la operación ${esc(id)}</h1><p><a href="#/" class="fuerte">Volver al modelo</a></p>`;

  const cia = D.ciaPorId.get(o.companiaId);
  const neg = D.negPorId.get(o.negocioId);
  const ter = o.territorioId ? D.terPorId.get(o.territorioId) : null;
  const clientesDeEsta = D.clientesDeOperacion.get(id) || [];
  const indicadores = (D.indicadoresDeOperacion.get(id) || []).map((i) => D.indPorId.get(i));
  const responsable = D.responsableDeOperacion.get(id);
  const motivoSinCliente = cia.nombre === "Medistik"
    ? "es un CEDIS multicliente: el sitio sirve a varios clientes y el nombre no dice a cuáles"
    : o.sitio ? "es un sitio multicuentas sin desglose en el nombre"
    : "es una línea de negocio, no una operación dedicada a un cliente";

  return `
    ${miniMapa(["Estructura", "Cliente · Contrato", "Indicadores", "Captura"], null)}
    <p class="chico"><a href="#/" class="apagado">← El modelo</a></p>
    <h1>${esc(o.id)} <span class="apagado" style="font-weight:400">${esc(o.nombre)}</span></h1>
    <p class="chico apagado">${o.activo ? "Operación activa" : "Operación inactiva"} ·
      ${o.sistemaDeclarado ? "sistema " + esc(o.sistemaDeclarado) : `<span class="escala">sin sistema declarado</span>`} ·
      ${o.clase ? esc(o.clase.replace(/_/g, " ")) : `<span class="escala">sin clase</span>`}</p>

    <ul class="cadena">
      <li><div class="eslabon">
        <p class="rotulo-eslabon">Estructura corporativa <a href="#/panorama">administrar →</a></p>
        <p>División <b>Logística</b> → <b>${esc(cia.nombre)}</b>
           <span class="chico apagado">(${esc(cia.corporativo)})</span> →
           negocio <b>${esc(neg.nombre)}</b>
           ${ter ? `→ territorio <b>${esc(ter.nombre)}</b> <span class="insignia i-azul">derivado</span>` : ""}</p>
      </div></li>

      <li><div class="eslabon">
        <p class="rotulo-eslabon">Cliente y contrato <a href="#/clientes">administrar →</a></p>
        ${clientesDeEsta.length === 0
          ? `<p><span class="insignia i-parcial">sin cliente derivable</span>
             <span class="chico apagado">— ${motivoSinCliente}. El modelo lo soporta vía
             contratos; el dato lo carga Comercial.</span></p>`
          : clientesDeEsta.map((c) => {
              const ct = D.contratoDeCliente.get(c.id);
              const hermanas = ct ? ct.operaciones.filter((x) => x !== id) : [];
              return `<p><a class="fuerte" href="#/cliente/${esc(c.id)}">${esc(c.nombre)}</a>
                ${origen(c.origen, c.estado)}
                ${ct ? `— vía contrato <b>${esc(ct.id)}</b> <span class="insignia i-parcial">EJEMPLO</span>
                        <span class="chico apagado">desde ${esc(ct.desde)}</span>` : ""}</p>
                ${hermanas.length ? `<div class="fichitas"><span class="chico apagado">del mismo contrato:</span>
                  ${hermanas.map((h) => `<a class="fichita" href="#/operacion/${esc(h)}"><b>${esc(h)}</b> ${esc((D.opPorId.get(h) || {}).nombre || "")}</a>`).join("")}
                </div>` : ""}`;
            }).join("")}
      </div></li>

      <li><div class="eslabon">
        <p class="rotulo-eslabon">Indicadores que se le piden — ${indicadores.length} <a href="#/indicadores">administrar →</a></p>
        <div class="fichitas">${indicadores.map((i) => {
          const og = D.origenDeIndicador.get(i.id);
          return `<span class="fichita" title="${esc(i.nombre)}"><b>${esc(i.id)}</b>
            <span class="apagado">${esc(i.frecuencia.toLowerCase())}</span>
            ${og.canal === "MANUAL"
              ? `<span class="apagado">· manual → ${esc(og.sistemaDestino || "?")} S${og.semanaDeTransicion}</span>`
              : `<span style="color:hsl(var(--primary-foreground))">· ${esc(og.sistemaDestino || "conectado")}</span>`}</span>`;
        }).join("")}</div>
        <p class="chico apagado" style="margin-top:.5rem">El alcance genera los envíos
        esperados de esta operación — con o sin responsable: por eso el hueco de captura se ve.</p>
      </div></li>

      <li><div class="eslabon">
        <p class="rotulo-eslabon">Quién captura <a href="#/personas">administrar →</a></p>
        ${responsable
          ? `<p><b>${esc(responsable.nombre)}</b> <span class="insignia i-azul">contacto · derivado</span>
             <span class="chico apagado">— responde por ${responsable.operaciones.length}
             operaciones${responsable.operaciones.length > 20 ? " ⚠ concentración" : ""}</span></p>`
          : `<p><span class="insignia i-parcial">sin quien capture</span>
             <span class="chico apagado">— la operación sigue debiendo sus indicadores: los
             esperados salen del alcance, no de la persona.</span></p>`}
      </div></li>
    </ul>`;
}

/** La ficha de un cliente: del cliente hacia abajo — contrato, operaciones, captura. */
function fichaCliente(id, D) {
  const c = D.cliPorId.get(id);
  if (!c) return `<h1>No existe el cliente ${esc(id)}</h1><p><a href="#/clientes" class="fuerte">Volver a clientes</a></p>`;

  const ct = D.contratoDeCliente.get(c.id);
  const ops = c.operaciones.map((op) => D.opPorId.get(op)).filter(Boolean);
  const semanales = c.operaciones.reduce((t, op) => t + (D.semanalesDe.get(op) || 0), 0);
  const responsables = [...new Set(c.operaciones.map((op) => (D.responsableDeOperacion.get(op) || {}).nombre).filter(Boolean))];

  return `
    ${miniMapa(["Cliente", "Contrato", "Operaciones", "Captura"], "Cliente")}
    <p class="chico"><a href="#/clientes" class="apagado">← Clientes y contratos</a></p>
    <h1>${esc(c.nombre)} ${origen(c.origen, c.estado)}</h1>
    ${c.estado === "POR_CONFIRMAR"
      ? `<p class="chico apagado">Derivado del nombre de sus operaciones — confirmarlo (o
         fusionarlo con otro) es una decisión de Comercial, no de una heurística.</p>` : ""}

    <ul class="cadena">
      <li><div class="eslabon">
        <p class="rotulo-eslabon">Contrato</p>
        ${ct
          ? `<p><b>${esc(ct.id)}</b> <span class="insignia i-parcial">EJEMPLO</span>
             <span class="chico apagado">con ${esc((D.ciaPorId.get(ct.companiaId) || {}).nombre || "")}
             · desde ${esc(ct.desde)} · sin dato real de vigencia, moneda ni tarifa — lo carga
             Comercial, y al llegar habilita la pregunta de rentabilidad.</span></p>`
          : `<p class="apagado">Sin contrato registrado.</p>`}
      </div></li>

      <li><div class="eslabon">
        <p class="rotulo-eslabon">Operaciones que lo sirven — ${ops.length}</p>
        <div class="fichitas">${ops.map((o) => `
          <a class="fichita" href="#/operacion/${esc(o.id)}"><b>${esc(o.id)}</b> ${esc(o.nombre)}
            ${o.territorioId ? `<span class="apagado">· ${esc(D.terPorId.get(o.territorioId).nombre)}</span>` : ""}
            ${o.activo ? "" : `<span class="apagado">· inactiva</span>`}</a>`).join("")}</div>
      </div></li>

      <li><div class="eslabon">
        <p class="rotulo-eslabon">Lo que se le mide y quién lo captura</p>
        <p><b class="num">${semanales}</b> <span class="chico apagado">envíos de indicadores
        semanales por periodo, capturados por</span>
        ${responsables.length ? responsables.map((r) => `<b>${esc(r)}</b>`).join(", ") : `<span class="escala">nadie con contacto conocido</span>`}</p>
      </div></li>
    </ul>`;
}

      El maestro gobierna <strong class="num">${S.m.operaciones.length}</strong> operaciones en
      <strong class="num">${S.m.companias.length}</strong> compañías, y hoy tiene
      <strong class="num escala">${abiertos.length}</strong> huecos abiertos.
      Un dato inventado para que la pantalla se vea completa es peor que el vacío.
    </p></div>

    <div class="calidad">
      ${tarjetas.map((t) => `
        <button class="hueco-tarjeta ${t.n === 0 ? "cerrado" : ""}" data-accion="ir" data-a="${t.ir}">
          <b class="num">${n0(t.n)}</b>
          <small><strong style="color:hsl(var(--foreground))">${esc(t.que)}</strong><br>${esc(t.nota)}</small>
          <span class="cierra">cierra: ${esc(t.cierra)}</span>
        </button>`).join("")}
    </div>

    ${S.registro.length ? seccion("Lo que se cerró en esta sesión", "en memoria — al recargar vuelve",
      `<ul style="list-style:none;padding:0;margin:0">${S.registro.map((r) =>
        `<li style="padding:.4rem 0;border-bottom:1px solid hsl(var(--border))" class="chico">${r}</li>`).join("")}</ul>`) : ""}

    <p class="chico apagado">Cada tarjeta dice quién cierra el hueco. El detalle de qué es
    cada uno está en <code>MDM/00_ESTRATEGIA.md</code> §6.</p>`;
}

/* ============================================================== 2 · panorama */

/** El árbol corporativo: división → compañía → negocio → operaciones. */
function panorama(D) {
  const m = S.m;
  const filtroHueco = S.ops.hueco;

  const pasaHueco = (o) =>
    !filtroHueco
    || (filtroHueco === "sin_clase" && o.clase === null)
    || (filtroHueco === "sin_sistema" && o.sistemaDeclarado === null)
    || (filtroHueco === "sin_captura" && !o.contactoCaptura);

  const porCia = new Map();
  for (const o of m.operaciones) {
    if (!pasaHueco(o)) continue;
    const porNeg = porCia.get(o.companiaId) || new Map();
    const lista = porNeg.get(o.negocioId) || [];
    lista.push(o);
    porNeg.set(o.negocioId, lista);
    porCia.set(o.companiaId, porNeg);
  }

  const candidatas = m.operaciones.filter((o) => o.clase === null
    && (!S.ops.companiaLote || o.companiaId === S.ops.companiaLote));

  const arbol = m.companias.map((cia) => {
    const porNeg = porCia.get(cia.id) || new Map();
    const total = [...porNeg.values()].reduce((t, l) => t + l.length, 0);
    if (filtroHueco && total === 0) return "";
    const abierta = S.abiertos.has(cia.id);
    return `<li>
      <div class="nodo ${abierta ? "abierto" : ""}" data-accion="nodo" data-a="${cia.id}">
        <span class="flecha">▸</span>${ico("building-2", 14)}
        <span class="fuerte">${esc(cia.nombre)}</span>
        <span class="chico apagado">${esc(cia.corporativo)}</span>
        <span class="conteo"><span class="insignia i-gris num">${total} operaciones</span></span>
      </div>
      ${abierta ? `<ul>${[...porNeg.entries()].map(([negId, ops]) => {
        const neg = D.negPorId.get(negId);
        const llave = cia.id + "|" + negId;
        const abiertoNeg = S.abiertos.has(llave);
        return `<li>
          <div class="nodo ${abiertoNeg ? "abierto" : ""}" data-accion="nodo" data-a="${llave}">
            <span class="flecha">▸</span>
            <span>${esc(neg.nombre)}</span>
            ${neg.clase ? `<span class="insignia i-gris">${esc(neg.clase)}</span>` : `<span class="insignia i-parcial">sin clase</span>`}
            <span class="conteo"><span class="chico apagado num">${ops.length}</span></span>
          </div>
          ${abiertoNeg ? `<ul>${ops.map((o) => `
            <li class="hoja">
              <a class="fuerte" href="#/operacion/${esc(o.id)}">${esc(o.id)}</a>
              <span class="chico trunca" style="max-width:16rem">${esc(o.nombre)}</span>
              ${o.territorioId ? `<span class="insignia i-azul">${esc(D.terPorId.get(o.territorioId).nombre)}</span>` : ""}
              ${o.clase ? `<span class="insignia i-gris">${esc(o.clase)}</span>` : `<span class="insignia i-parcial">sin clase</span>`}
              ${o.sistemaDeclarado ? "" : `<span class="chico escala">sin sistema</span>`}
              ${o.activo ? "" : `<span class="insignia i-gris">inactiva</span>`}
            </li>`).join("")}</ul>` : ""}
        </li>`;
      }).join("")}</ul>` : ""}
    </li>`;
  }).join("");

  return `
    ${miniMapa(["División", "Compañía", "Negocio", "Operación"], "Operación")}
    <h1>Panorama</h1>
    <div class="respuesta"><p>
      <strong>1</strong> división · <strong class="num">${m.companias.length}</strong> compañías ·
      <strong class="num">${m.negocios.length}</strong> negocios ·
      <strong class="num">${m.territorios.length}</strong> territorios derivados ·
      <strong class="num">${m.operaciones.length}</strong> operaciones.
      La clase está abierta en <strong class="num escala">${D.huecos.operaciones_sin_clase}</strong>.
    </p></div>

    <div class="filtros">
      <div class="campo"><label for="p-hueco">Ver</label>
        <select id="p-hueco" data-accion="ops-hueco">
          <option value="" ${!filtroHueco ? "selected" : ""}>Todo</option>
          <option value="sin_clase" ${filtroHueco === "sin_clase" ? "selected" : ""}>Sólo sin clase</option>
          <option value="sin_sistema" ${filtroHueco === "sin_sistema" ? "selected" : ""}>Sólo sin sistema</option>
          <option value="sin_captura" ${filtroHueco === "sin_captura" ? "selected" : ""}>Sólo sin quien capture</option>
        </select></div>
    </div>

    <ul class="arbol">
      <li><div class="nodo abierto" style="cursor:default">
        ${ico("building-2", 15)} <span class="fuerte">División ${esc(m.division.nombre)}</span>
        ${origen(m.division.origen)}
      </div>
      <ul>${arbol}</ul></li>
    </ul>

    ${seccion("Cerrar la clase por lote", `${candidatas.length} operaciones candidatas`, `
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end">
        <div class="campo"><label for="lote-cia">Compañía</label>
          <select id="lote-cia" data-accion="lote-cia">
            <option value="">Todas</option>
            ${m.companias.map((c) => `<option value="${c.id}" ${S.ops.companiaLote === c.id ? "selected" : ""}>${esc(c.nombre)}</option>`).join("")}
          </select></div>
        <div class="campo"><label for="lote-clase">Clase</label>
          <select id="lote-clase" data-accion="lote-clase">
            ${CLASES.map((c) => `<option value="${c}" ${S.ops.claseLote === c ? "selected" : ""}>${c.replace(/_/g, " ")}</option>`).join("")}
          </select></div>
        <button class="boton" data-accion="clasificar-lote" ${candidatas.length === 0 ? "disabled" : ""}>
          Clasificar ${candidatas.length}</button>
      </div>
      <p class="chico apagado" style="margin-top:.6rem">La clase nace en nulo a propósito:
      133 nombres no dan ninguna pista y adivinarla sería inventar. Cerrarla es una decisión,
      y por eso es un botón y no una migración.</p>`)}`;
}

/* ============================================================== 3 · clientes */

function clientes(D) {
  const m = S.m;
  const texto = S.cli.busqueda.trim().toLowerCase();
  const lista = m.clientes.filter((c) =>
    (!S.cli.soloPorConfirmar || c.estado === "POR_CONFIRMAR")
    && (!texto || c.nombre.toLowerCase().includes(texto)));

  const contratoDe = new Map(m.contratos.map((ct) => [ct.clienteId, ct]));
  const confirmados = m.clientes.filter((c) => c.estado === "CONFIRMADO").length;

  return `
    ${miniMapa(["Cliente", "Contrato", "Operación"], "Cliente")}
    <h1>Clientes y contratos</h1>
    <div class="respuesta"><p>
      <strong class="num">${m.clientes.length}</strong> clientes derivados de los nombres de
      operación — <strong class="num">${confirmados}</strong> confirmados,
      <strong class="num escala">${m.clientes.length - confirmados}</strong> por confirmar — y
      <strong class="num">${D.huecos.operaciones_sin_cliente_derivable}</strong> operaciones sin
      cliente derivable. Los <strong class="num">${m.contratos.length}</strong> contratos son
      <span class="insignia i-parcial">EJEMPLO</span>: enseñan la relación, no el dato.
    </p></div>

    <div class="filtros">
      <div class="campo"><label for="c-buscar">Buscar</label>
        <input id="c-buscar" type="text" value="${esc(S.cli.busqueda)}" placeholder="Cliente" data-accion="cli-buscar"></div>
      <div class="campo"><label for="c-nuevo">Alta de cliente (manual)</label>
        <div style="display:flex;gap:.5rem">
          <input id="c-nuevo" type="text" placeholder="Nombre del cliente real">
          <button class="boton" data-accion="alta-cliente">${ico("plus", 14)} Crear</button>
        </div></div>
      <div class="campo"><label>&nbsp;</label>
        <button class="boton borde" data-accion="cli-filtro">${S.cli.soloPorConfirmar ? "Ver todos" : "Sólo por confirmar"}</button></div>
    </div>

    ${seccion("El maestro de clientes", `${lista.length} en pantalla`, `
      <div class="desliza"><table>
        <thead><tr><th>Cliente</th><th>Origen</th><th>Operaciones que lo sirven</th><th>Contrato</th><th></th></tr></thead>
        <tbody>${lista.slice(0, 40).map((c) => {
          const ct = contratoDe.get(c.id);
          const visibles = c.operaciones.slice(0, 3);
          return `<tr>
            <td><a class="fuerte" href="#/cliente/${esc(c.id)}">${esc(c.nombre)}</a></td>
            <td>${origen(c.origen, c.estado)}</td>
            <td class="chico">${visibles.map((op) =>
                `<a href="#/operacion/${esc(op)}" class="fuerte">${esc(op)}</a>`).join(" · ")
              }${c.operaciones.length > 3 ? ` <span class="apagado">y ${c.operaciones.length - 3} más</span>` : ""}
              ${c.operaciones.length === 0 ? `<span class="apagado">—</span>` : ""}</td>
            <td class="chico">${ct
              ? `${esc(ct.id)} <span class="insignia i-parcial">EJEMPLO</span> <span class="apagado">desde ${esc(ct.desde)}</span>`
              : `<span class="apagado">—</span>`}</td>
            <td class="der">${c.estado === "POR_CONFIRMAR"
              ? `<button class="boton borde chico" data-accion="confirmar-cliente" data-a="${c.id}">Confirmar</button>`
              : `<span class="insignia i-completa">✓</span>`}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>
      ${lista.length > 40 ? `<p class="chico apagado" style="margin-top:.5rem">Se muestran 40 de ${lista.length}. Busque para acotar.</p>` : ""}`)}

    <div class="aviso">${ico("triangle-alert", 14)} <strong>Confirmar no es un trámite.</strong>
      El derivado produce duplicados legítimos —¿«Samsung», «Samsung PIQ» y «SDS Samsung» son
      uno o tres?— y fusionarlos es una decisión de Comercial. El servicio del maestro trae
      <code>POST /clientes/fusionar</code> para eso; esta demostración sólo confirma.</div>

    ${seccion("Sin cliente derivable", `${D.huecos.operaciones_sin_cliente_derivable} operaciones — el hueco honesto`, `
      <div class="desliza"><table>
        <thead><tr><th>Operación</th><th>Compañía</th><th>Por qué</th></tr></thead>
        <tbody>${S.m.huecos.sin_cliente.slice(0, 12).map((id) => {
          const o = D.opPorId.get(id);
          const cia = D.ciaPorId.get(o.companiaId);
          const motivo = cia.nombre === "Medistik" ? "CEDIS multicliente: el sitio sirve a varios"
            : o.sitio ? "sitio multicuentas sin desglose en el nombre"
            : "línea de negocio, no cliente dedicado";
          return `<tr>
            <td><span class="fuerte">${esc(id)}</span> <span class="chico apagado">${esc(o.nombre)}</span></td>
            <td class="chico">${esc(cia.nombre)}</td>
            <td class="chico apagado">${motivo}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>
      <p class="chico apagado" style="margin-top:.5rem">Estas operaciones se relacionan con
      clientes <strong>a través de contratos</strong> cuando Comercial los cargue — el modelo
      lo soporta; el dato no existe todavía.</p>`)}`;
}

/* ============================================================== 4 · indicadores */

function indicadores(D) {
  const m = S.m;
  const canal = S.ind.canal;
  const origenDe = new Map(m.origenes.map((o) => [o.indicadorId, o]));
  const lista = m.indicadores.filter((i) => {
    const o = origenDe.get(i.id);
    return !canal || o.canal === canal;
  });

  const conectados = m.origenes.filter((o) => o.estadoConexion !== "PENDIENTE").length;

  // El calendario de apagado, agrupado por semana de transición.
  const porSemana = new Map();
  for (const o of m.origenes) {
    const s = o.semanaDeTransicion;
    const grupo = porSemana.get(s) || [];
    grupo.push(o);
    porSemana.set(s, grupo);
  }

  return `
    ${miniMapa(["Indicador", "Alcance", "Origen del dato", "Operación"], "Indicador")}
    <h1>Indicadores y origen del dato</h1>
    <div class="respuesta"><p>
      Los <strong class="num">${m.indicadores.length}</strong> indicadores llegan hoy por el
      canal <strong>manual</strong> — ese canal es CoreTX Captura —, y
      <strong class="num">${conectados}</strong> se han conectado a su sistema de origen.
      El alcance suma <strong class="num">${n0(Object.values(m.alcances).reduce((t, l) => t + l.length, 0))}</strong>
      renglones de cobertura: de ahí salen los envíos esperados.
    </p></div>

    ${seccion("El calendario de transición", "⚠️ el año no está en ninguna fuente — lo cierra Tecnología", `
      <div class="rejilla dos">${[...porSemana.entries()].sort((a, b) => a[0] - b[0]).map(([sem, grupo]) => `
        <div class="tarjeta">
          <h3>Semana ${sem}</h3>
          <p class="chico">${grupo.map((g) => g.indicadorId).join(" · ")}</p>
          <p class="chico apagado">${esc(grupo[0].sistemaDestino || "")}${grupo.length > 1 && new Set(grupo.map(g => g.sistemaDestino)).size > 1 ? " y otros" : ""}</p>
        </div>`).join("")}</div>`)}

    <div class="filtros">
      <div class="campo"><label for="i-canal">Canal</label>
        <select id="i-canal" data-accion="ind-canal">
          <option value="">Todos</option>
          <option value="MANUAL" ${canal === "MANUAL" ? "selected" : ""}>Manual (Captura)</option>
          <option value="AUTOMATIZADO" ${canal === "AUTOMATIZADO" ? "selected" : ""}>Automatizado</option>
        </select></div>
    </div>

    ${seccion("Indicadores", `${lista.length} en pantalla`, `
      <div class="desliza"><table>
        <thead><tr><th>Indicador</th><th>Dominio</th><th>Frecuencia</th><th>Tipo · sentido</th>
          <th class="der">Cubre</th><th>Origen del dato</th><th></th></tr></thead>
        <tbody>${lista.map((i) => {
          const o = origenDe.get(i.id);
          return `<tr>
            <td><span class="fuerte">${esc(i.id)}</span>
              <p class="chico apagado trunca" style="max-width:15rem">${esc(i.nombre)}</p></td>
            <td class="chico">${esc(i.dominio)}</td>
            <td class="chico">${esc(i.frecuencia)}</td>
            <td class="chico">${esc(i.tipo)} · ${esc(i.sentido.replace(/_/g, " ").toLowerCase())}</td>
            <td class="der num">${i.cubre}</td>
            <td class="chico">${o.canal === "MANUAL"
              ? `<span class="insignia i-azul">manual</span> → ${esc(o.sistemaDestino || "?")} en S${o.semanaDeTransicion}`
              : `<span class="insignia i-completa">${esc(o.sistemaDestino || "")}</span> <span class="apagado">${esc(o.estadoConexion.toLowerCase().replace("_", " "))}</span>`}</td>
            <td class="der">${o.canal === "MANUAL"
              ? `<button class="boton borde chico" data-accion="conectar" data-a="${i.id}">Conectar</button>`
              : ""}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>`)}

    <div class="aviso">${ico("triangle-alert", 14)} <strong>«Conectar» es la operación que
      apaga la captura manual de un indicador</strong>: cierra la fila MANUAL con fecha y abre
      una AUTOMATIZADO en pruebas. En el maestro real, Captura deja de generar esperados para
      ese indicador — la misma tabla gobierna las dos vías. Aquí es una demostración en
      memoria.</div>

    <p class="chico apagado">La taxonomía (<code>tipo</code>, <code>sentido</code>) se derivó
    de los datos y necesita firma de dominio. Los campos, fórmulas y las 239 reglas viven en
    el sistema de captura: son del conector manual, no del maestro.</p>`;
}

/* ============================================================== 5 · personas */

function personas(D) {
  const m = S.m;
  const tope = Math.max(...D.carga.map((c) => c.envios), 1);
  const sinContacto = m.operaciones.filter((o) => !o.contactoCaptura);
  const sinCaptura = sinContacto.filter((o) => o.activo);

  return `
    ${miniMapa(["Persona", "Responsabilidad", "Operación"], "Persona")}
    <h1>Personas y responsabilidad</h1>
    <div class="respuesta"><p>
      <strong class="num">${D.carga.length}</strong> personas responden por la captura —
      derivadas de los contactos del análisis, que <strong>no son una asignación</strong> — y
      la más cargada debe <strong class="num escala">${n0(D.carga[0].envios)}</strong> envíos
      por semana. ${sinCaptura.length === 0 && sinContacto.length > 0
        ? `Las <strong class="num">${sinContacto.length}</strong> operaciones sin contacto
           están <strong>inactivas</strong>: ninguna activa queda sin quien capture.`
        : `<strong class="num escala">${sinCaptura.length}</strong> operaciones activas no
           tienen a nadie.`}
    </p></div>

    ${seccion("Carga por persona", "envíos semanales según el alcance vigente", `
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Verbo</th><th>Origen</th><th class="der">Operaciones</th>
          <th class="der">Envíos/semana</th><th style="width:9rem"></th><th></th></tr></thead>
        <tbody>${D.carga.map((c) => `<tr>
          <td class="fuerte">${esc(c.nombre)}<p class="chico apagado trunca" style="max-width:16rem">${esc(c.correo || "")}</p></td>
          <td><span class="insignia i-azul">${esc(c.verbo)}</span></td>
          <td>${origen("DERIVADO")}</td>
          <td class="der num chico">${c.operaciones.slice(0, 3).map((op) =>
              `<a href="#/operacion/${esc(op)}" class="fuerte">${esc(op)}</a>`).join(" ")
            }${c.operaciones.length > 3 ? ` <span class="apagado">y ${c.operaciones.length - 3} más</span>` : ""}</td>
          <td class="der num ${c.envios > 200 ? "escala fuerte" : ""}">${n0(c.envios)}${c.envios > 200 ? " ⚠" : ""}</td>
          <td><span class="barra"><i style="width:${Math.round(c.envios / tope * 100)}%;${c.envios > 200 ? "background:hsl(var(--destructive-warm))" : ""}"></i></span></td>
          <td class="der"><button class="boton plano chico" data-accion="retirar-persona" data-a="${esc(c.nombre)}">Retirar</button></td>
        </tr>`).join("")}</tbody>
      </table></div>
      <p class="chico apagado" style="margin-top:.5rem">Retirar pone fecha de fin a la
      responsabilidad; <strong>nunca borra</strong>. Las operaciones quedan debiendo sus
      indicadores igual — los esperados salen del alcance, no de la persona: ésa es la
      diferencia entre cobertura y responsabilidad.</p>`)}

    ${seccion("Los tres verbos", "la responsabilidad generalizada", `
      <div class="rejilla tres" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
        <div class="tarjeta"><h3>ADMINISTRA</h3><p class="chico apagado">Gobierna catálogos de un
          ámbito. El dueño del maestro es ADMINISTRA × DIVISION. La API del maestro se
          autoriza con este verbo: el maestro se gobierna con su propio modelo.</p></div>
        <div class="tarjeta"><h3>CAPTURA</h3><p class="chico apagado">La asignación de CoreTX
          Captura es el caso CAPTURA × OPERACION. Más de dos responsables del mismo ámbito se
          permite; desde el tercero se avisa, no se bloquea.</p></div>
        <div class="tarjeta"><h3>CONSULTA</h3><p class="chico apagado">Un director es CONSULTA ×
          COMPANIA. En el lake se proyecta como seguridad a nivel de fila, derivada de esta
          tabla — no mantenida a mano en cada tablero.</p></div>
      </div>`)}

    ${seccion("Sin contacto de captura", `${sinContacto.length} operaciones — las ${sinCaptura.length} activas primero`, sinContacto.length === 0
      ? `<p class="chico apagado">Ninguna.</p>`
      : `<div class="desliza"><table>
          <thead><tr><th>Operación</th><th>Compañía</th><th></th></tr></thead>
          <tbody>${sinContacto.map((o) => `<tr>
            <td><span class="fuerte">${esc(o.id)}</span> <span class="chico apagado">${esc(o.nombre)}</span>
              ${o.activo ? "" : ` <span class="insignia i-gris">inactiva</span>`}</td>
            <td class="chico">${esc(D.ciaPorId.get(o.companiaId).nombre)}</td>
            <td class="der"><button class="boton borde chico" data-accion="asignar-captura" data-a="${o.id}">Asignar…</button></td>
          </tr>`).join("")}</tbody>
        </table></div>`)}`;
}

/* ============================================================== sucesos */

function anotar(texto) {
  S.registro.unshift(`${texto} <span class="apagado">· ${new Date().toLocaleTimeString("es-MX")}</span>`);
}

document.addEventListener("click", (evento) => {
  const nodo = evento.target.closest("[data-accion]");
  if (!nodo) return;
  const a = nodo.dataset.a;

  switch (nodo.dataset.accion) {
    case "ir": location.hash = a; return;
    case "nodo":
      S.abiertos.has(a) ? S.abiertos.delete(a) : S.abiertos.add(a);
      break;
    case "clasificar-lote": {
      const ids = S.m.operaciones
        .filter((o) => o.clase === null && (!S.ops.companiaLote || o.companiaId === S.ops.companiaLote))
        .map((o) => o.id);
      for (const o of S.m.operaciones) if (ids.includes(o.id)) o.clase = S.ops.claseLote;
      anotar(`Clasificadas <strong>${ids.length}</strong> operaciones como ${S.ops.claseLote}`);
      break;
    }
    case "confirmar-cliente": {
      const c = S.m.clientes.find((x) => x.id === a);
      if (c) { c.estado = "CONFIRMADO"; anotar(`Cliente <strong>${esc(c.nombre)}</strong> confirmado`); }
      break;
    }
    case "alta-cliente": {
      const campo = document.getElementById("c-nuevo");
      const nombre = (campo ? campo.value : "").trim();
      if (!nombre) return;
      if (S.m.clientes.some((c) => c.nombre.toLowerCase() === nombre.toLowerCase())) return;
      S.m.clientes.push({
        id: `CL${String(S.m.clientes.length + 1).padStart(3, "0")}`,
        nombre, estado: "CONFIRMADO", origen: "MANUAL", operaciones: [],
      });
      S.m.clientes.sort((x, y) => x.nombre.localeCompare(y.nombre));
      anotar(`Cliente <strong>${esc(nombre)}</strong> creado a mano`);
      break;
    }
    case "conectar": {
      const o = S.m.origenes.find((x) => x.indicadorId === a);
      if (o) {
        o.canal = "AUTOMATIZADO";
        o.estadoConexion = "EN_PRUEBAS";
        anotar(`<strong>${a}</strong> conectado a ${esc(o.sistemaDestino || "su sistema")} — en pruebas; la captura manual se apaga al confirmar`);
      }
      break;
    }
    case "retirar-persona": {
      const r = S.m.responsables.find((x) => x.nombre === a);
      if (r) {
        S.m.responsables = S.m.responsables.filter((x) => x !== r);
        anotar(`Responsabilidad de <strong>${esc(a)}</strong> retirada — sus ${r.operaciones.length} operaciones siguen debiendo sus indicadores`);
      }
      break;
    }
    case "asignar-captura": {
      const o = S.m.operaciones.find((x) => x.id === a);
      if (o) {
        o.contactoCaptura = "— por nombrar —";
        anotar(`<strong>${a}</strong> marcada para asignar responsable`);
      }
      break;
    }
    case "cli-filtro": S.cli.soloPorConfirmar = !S.cli.soloPorConfirmar; break;
    default: return;
  }
  pintar();
});

document.addEventListener("input", (evento) => {
  const nodo = evento.target.closest("[data-accion]");
  if (!nodo) return;
  if (nodo.dataset.accion === "cli-buscar") {
    S.cli.busqueda = nodo.value;
    const foco = nodo.id, cursor = nodo.value.length;
    pintar();
    const otra = document.getElementById(foco);
    if (otra) { otra.focus(); try { otra.setSelectionRange(cursor, cursor); } catch (e) {} }
  }
});

document.addEventListener("change", (evento) => {
  const nodo = evento.target.closest("[data-accion]");
  if (!nodo) return;
  switch (nodo.dataset.accion) {
    case "ops-hueco": S.ops.hueco = nodo.value; break;
    case "lote-cia": S.ops.companiaLote = nodo.value; break;
    case "lote-clase": S.ops.claseLote = nodo.value; break;
    case "ind-canal": S.ind.canal = nodo.value; break;
    default: return;
  }
  pintar();
});

window.addEventListener("hashchange", pintar);

if (!location.hash) location.hash = "#/";
pintar();

</script>
</body>
</html>
