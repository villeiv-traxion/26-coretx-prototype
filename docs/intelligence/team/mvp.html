<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreTX Captura — demostración</title>
<style>/* Los tokens del design system de Traxion, copiados de
   node_modules/@traxion-global/design-system/dist/theme.css.

   Se copian en vez de importarse porque el paquete es privado y este archivo no pide nada a
   la red. Si el design system cambia sus tokens, esto se queda atrás — es un corte con
   fecha, y lo dice en el pie. */
:root{
  --background:0 0% 100%; --foreground:0 0% 10%;
  --card:0 0% 100%;
  --primary:64 100% 44%; --primary-light:62 80% 56%; --primary-dark:63 100% 37%;
  --primary-foreground:214 3% 25%;
  --secondary:214 3% 40%; --secondary-light:60 2% 81%; --secondary-medium:210 2% 60%;
  --muted:0 0% 96.1%; --muted-foreground:0 0% 45.1%;
  --destructive:3 55.8% 51.2%; --destructive-warm:12 100% 56.7%;
  --border:0 0% 89.8%; --ring:65 100% 41%;
  --radius:.5rem;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:hsl(var(--background)); color:hsl(var(--foreground));
  font-family:Roboto,"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; line-height:1.25; font-weight:600; letter-spacing:-.01em}
h1{font-size:1.5rem} h2{font-size:1.0625rem} h3{font-size:.9375rem}
p{margin:0}
a{color:inherit; text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.apagado{color:hsl(var(--muted-foreground))}
.chico{font-size:.8125rem}
.fuerte{font-weight:600}
.trunca{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ------------------------------------------------------------------ armazón */
.marco{display:flex; flex-direction:column; min-height:100%}
.cabecera{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:1rem;
  height:3.25rem; padding:0 1rem; background:hsl(var(--background));
  border-bottom:1px solid hsl(var(--border));
}
.marca{display:flex; align-items:center; gap:.55rem; font-weight:700; letter-spacing:-.02em; white-space:nowrap}
.marca svg{color:hsl(var(--primary-dark))}
.etiqueta{
  padding:.1rem .5rem; border:1px solid hsl(var(--border)); border-radius:99px;
  font-size:.6875rem; font-weight:500; color:hsl(var(--muted-foreground));
}
.cabecera .relleno{flex:1}
.usuario{
  display:flex; align-items:center; gap:.6rem; padding:.3rem .5rem .3rem .35rem;
  border:1px solid hsl(var(--border)); border-radius:99px; cursor:pointer; background:none;
  font:inherit; color:inherit;
}
.usuario:hover{background:hsl(var(--muted))}
.avatar{
  width:1.75rem; height:1.75rem; border-radius:99px; background:hsl(var(--primary));
  color:hsl(var(--primary-foreground)); display:grid; place-items:center;
  font-size:.6875rem; font-weight:700;
}
.rol{
  padding:.05rem .5rem; border-radius:99px; background:hsl(var(--primary)/.25);
  color:hsl(var(--primary-foreground)); font-size:.625rem; font-weight:700; letter-spacing:.04em;
}
.cuerpo{display:flex; flex:1; min-height:0}
.lateral{
  width:14.5rem; flex-shrink:0; border-right:1px solid hsl(var(--border));
  padding:1rem .75rem; display:flex; flex-direction:column; gap:.15rem;
}
.lateral a{
  display:flex; align-items:center; gap:.6rem; padding:.6rem .75rem; border-radius:.375rem;
  color:hsl(var(--muted-foreground)); font-weight:500;
}
.lateral a:hover{background:hsl(var(--muted)); color:hsl(var(--foreground))}
.lateral a.activa{background:hsl(var(--secondary)); color:#fff}
.lateral .nota{margin-top:auto; padding:.75rem; font-size:.75rem; color:hsl(var(--muted-foreground)); border-top:1px solid hsl(var(--border))}
.pagina{flex:1; min-width:0; padding:1.5rem 1.75rem 4rem}
.pagina > * + *{margin-top:1.5rem}
@media(max-width:860px){
  .lateral{display:none}
  .pagina{padding:1rem}
  .lateral.abierta{
    display:flex; position:fixed; inset:3.25rem auto 0 0; z-index:40;
    background:hsl(var(--background)); box-shadow:0 0 0 100vmax hsl(0 0% 0%/.3);
  }
}
.menu-movil{display:none; background:none; border:none; cursor:pointer; color:inherit; padding:.25rem}
@media(max-width:860px){ .menu-movil{display:block} }

/* ------------------------------------------------------------------ bloques */
.respuesta{
  border-top:1px solid hsl(var(--border)); border-bottom:1px solid hsl(var(--border));
  padding:1rem 0; font-size:1.0625rem; line-height:1.45;
}
.seccion > .titulo{
  display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between;
  gap:.75rem; margin-bottom:.75rem;
}
.rejilla{display:grid; gap:1rem}
.rejilla.dos{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tarjeta{border:1px solid hsl(var(--border)); border-radius:var(--radius); padding:1rem 1.25rem}
.vacio{
  border:1px dashed hsl(var(--border)); border-radius:var(--radius);
  padding:2.5rem 1.5rem; text-align:center;
}
.vacio h3{margin-bottom:.35rem}
.aviso{
  border-left:3px solid hsl(var(--destructive-warm)); background:hsl(var(--destructive-warm)/.08);
  padding:.85rem 1.1rem; border-radius:0 .375rem .375rem 0; font-size:.875rem;
}
.filtros{display:grid; gap:.75rem; grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.campo{display:flex; flex-direction:column; gap:.3rem}
label{font-size:.8125rem; font-weight:500}

/* ------------------------------------------------------------------ controles */
input,select,button{font:inherit; color:inherit}
input[type=text],input[type=number],select{
  width:100%; padding:.45rem .6rem; border:1px solid hsl(var(--border)); border-radius:.375rem;
  background:hsl(var(--background)); font-size:.875rem;
}
input[type=number]{font-variant-numeric:tabular-nums; min-width:5.5rem}
input:focus,select:focus{outline:2px solid hsl(var(--ring)); outline-offset:-1px}
input[aria-invalid=true]{border-color:hsl(var(--destructive)); background:hsl(var(--destructive)/.05)}
.boton{
  display:inline-flex; align-items:center; gap:.4rem; justify-content:center;
  padding:.5rem 1rem; border-radius:.375rem; border:1px solid transparent; cursor:pointer;
  font-size:.875rem; font-weight:600; background:hsl(var(--primary)); color:hsl(var(--primary-foreground));
  white-space:nowrap;
}
.boton:hover{background:hsl(var(--primary-dark)); color:#fff}
.boton.borde{background:none; border-color:hsl(var(--border)); font-weight:500}
.boton.borde:hover{background:hsl(var(--muted)); color:inherit}
.boton.plano{background:none; border-color:transparent; color:hsl(var(--secondary)); padding:.35rem .5rem; font-weight:500}
.boton.plano:hover{background:hsl(var(--muted)); color:inherit}
.boton.chico{padding:.3rem .65rem; font-size:.8125rem}
.boton:disabled{opacity:.45; cursor:not-allowed}
.boton.peligro{background:none; border-color:hsl(var(--destructive)/.4); color:hsl(var(--destructive))}
.boton.peligro:hover{background:hsl(var(--destructive)/.08); color:hsl(var(--destructive))}

/* ------------------------------------------------------------------ tablas */
.desliza{overflow-x:auto; border:1px solid hsl(var(--border)); border-radius:var(--radius)}
table{border-collapse:collapse; width:100%; font-size:.875rem}
th,td{text-align:left; padding:.6rem .8rem; border-bottom:1px solid hsl(var(--border)); vertical-align:middle}
th{
  font-size:.6875rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  color:hsl(var(--muted-foreground)); white-space:nowrap; background:hsl(var(--muted)/.6);
}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:hsl(var(--muted)/.5)}
td.der,th.der{text-align:right}
td.cen,th.cen{text-align:center}
.pegada{position:sticky; left:0; background:hsl(var(--background))}
tr:hover .pegada{background:hsl(var(--muted)/.5)}

/* ------------------------------------------------------------------ señales */
.insignia{display:inline-block; padding:.12rem .55rem; border-radius:99px; font-size:.75rem; font-weight:600; white-space:nowrap}
.i-completa{background:hsl(var(--primary)/.25); color:hsl(var(--primary-foreground))}
.i-casi{color:hsl(var(--muted-foreground))}
.i-parcial{background:hsl(var(--destructive-warm)/.15); color:hsl(var(--destructive-warm))}
.i-nada{background:hsl(var(--destructive)/.13); color:hsl(var(--destructive))}
.i-gris{background:hsl(var(--muted)); color:hsl(var(--muted-foreground))}
.i-azul{background:hsl(var(--secondary)/.12); color:hsl(var(--secondary))}
.marca-sem{
  display:inline-flex; align-items:center; justify-content:center; width:2.4rem; height:1.6rem;
  border-radius:.25rem; font-size:.6875rem; font-variant-numeric:tabular-nums;
}
.barra{height:7px; background:hsl(var(--muted)); border-radius:99px; overflow:hidden; min-width:6rem}
.barra i{display:block; height:100%; background:hsl(var(--primary-dark)); border-radius:99px}
.reloj{display:inline-flex; align-items:center; gap:.35rem; font-size:.8125rem; white-space:nowrap}
.urgente{color:hsl(var(--destructive))}
.pronto{color:hsl(var(--destructive-warm))}
.error{display:block; color:hsl(var(--destructive)); font-size:.75rem; margin-top:.25rem; max-width:26rem; line-height:1.35}
.escala{color:hsl(var(--destructive-warm))}

/* ------------------------------------------------------------------ matriz */
.bloque{border:1px solid hsl(var(--border)); border-radius:var(--radius); overflow:hidden}
.bloque > .barra-titulo{
  display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; justify-content:space-between;
  padding:.75rem 1rem; background:hsl(var(--muted)/.6); border-bottom:1px solid hsl(var(--border));
}
.bloque .pie{
  display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; justify-content:space-between;
  padding:.85rem 1rem; border-top:1px solid hsl(var(--border));
}
.resultado{font-weight:600; font-variant-numeric:tabular-nums}
.resultado.sin{color:hsl(var(--muted-foreground)); font-weight:400}
.veredicto{padding:.85rem 1rem; border-top:1px solid hsl(var(--border)); font-size:.875rem}
.veredicto.ok{background:hsl(var(--primary)/.12)}
.veredicto.mal{background:hsl(var(--destructive)/.07)}
.veredicto.retiene{background:hsl(var(--destructive-warm)/.1)}
details{border:1px solid hsl(var(--border)); border-radius:var(--radius)}
summary{padding:.75rem 1rem; cursor:pointer; font-weight:500; font-size:.875rem}
summary:hover{background:hsl(var(--muted)/.5)}
details[open] summary{border-bottom:1px solid hsl(var(--border))}

/* ------------------------------------------------------------------ pestañas */
.pestanas{display:flex; gap:.25rem; overflow-x:auto; border-bottom:1px solid hsl(var(--border))}
.pestanas button{
  background:none; border:none; border-bottom:2px solid transparent; cursor:pointer;
  padding:.6rem .85rem; font-size:.875rem; font-weight:500; color:hsl(var(--muted-foreground));
  white-space:nowrap;
}
.pestanas button:hover{color:hsl(var(--foreground))}
.pestanas button.activa{color:hsl(var(--foreground)); border-bottom-color:hsl(var(--primary))}

/* ------------------------------------------------------------------ gráfica */
.grafica{width:100%; height:230px}
.grafica .eje{stroke:hsl(var(--border))}
.grafica .linea{fill:none; stroke:hsl(var(--primary-dark)); stroke-width:2}
.grafica .punto{fill:hsl(var(--primary-dark))}
.grafica text{font-size:10px; fill:hsl(var(--muted-foreground))}
.duelo{display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.duelo b{display:block; font-size:1.75rem; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
</style>
</head>

/** Los envíos vienen posicionales y con las cadenas repetidas internadas, para que el

function descomprimirEnvios(p) {
  const base = Date.parse(p.base);
  const dosDigitos = (x) => String(x).padStart(2, "0");
  return p.filas.map((f, i) => {
    let recibidoEn = null;
    if (f[5] !== null) {
      // Se devuelve en el mismo formato que traía: hora local de la operación, −06:00.
      // Se resta el huso para poder leer las partes con `getUTC*` y que salga la hora local.
      const t = new Date(base + f[5] * 60000 - 6 * 3600000);
      recibidoEn = `${t.getUTCFullYear()}-${dosDigitos(t.getUTCMonth() + 1)}-${dosDigitos(t.getUTCDate())}`

    }
    return {
      id: `E${String(i + 1).padStart(6, "0")}`,
      indicadorId: p.indicadores[f[0]],
      operacionId: p.operaciones[f[1]],
      periodo: p.periodos[f[2]],
      estado: p.estados[f[3]],
      resultado: f[4],

/** El alcance, espejo de `lib/demo.tsx` y de `app/dominio/alcance.py`.
 *  La cobertura manda sobre el grupo: un grupo puede nombrar un indicador que a una
 *  operación no se le pide, y ahí no hay nada que capturar. */
function derivar() {
  const c = S.catalogo;
  const operacionesPorId = new Map(c.operaciones.map((o) => [o.id, o]));
  const indicadoresPorId = new Map(c.indicadores.map((i) => [i.id, i]));
  const usuariosPorId = new Map(DATOS.usuarios.map((u) => [u.id, u]));
  const companiasPorId = new Map(c.companias.map((x) => [x.id, x]));

  const puedeVerTodo = VEN_TODO.includes(S.usuario.rol);
  const vigentes = S.asignaciones.filter((a) => a.hasta === null);
  const propias = vigentes.filter((a) => a.usuarioId === S.usuario.id);

  const llaves = new Set();
  for (const a of propias) {
    if (a.ambito === "OPERACION" && a.operacionId) {
      for (const [indId, ops] of Object.entries(c.cobertura)) {
        if (ops.includes(a.operacionId)) llaves.add(`${a.operacionId}|${indId}`);
      }
      continue;
    }
    const grupo = c.grupos.find((g) => g.id === a.grupoId);
    if (!grupo) continue;
    for (const op of c.operaciones) {
      if (op.companiaId !== a.companiaId) continue;
      for (const indId of grupo.indicadores) {
        if ((c.cobertura[indId] || []).includes(op.id)) llaves.add(`${op.id}|${indId}`);
      }
    }
  }

  const visibles = puedeVerTodo
    ? S.envios
    : S.envios.filter((e) => llaves.has(`${e.operacionId}|${e.indicadorId}`));

  return {
    operacionesPorId, indicadoresPorId, usuariosPorId, companiasPorId,
    puedeVerTodo, vigentes, propias, llaves, visibles,
    asignacionesVisibles: puedeVerTodo ? vigentes : propias,
    mias: L.operacionesDe(propias, operacionesPorId),
    puedeCapturar: (opId, indId) =>
      S.usuario.rol === "LECTURA" ? false : puedeVerTodo || llaves.has(`${opId}|${indId}`),
  };
}

/** Registrar: una corrección **no reemplaza**, nace apuntando al anterior (§5.2.3). */
function registrar(envio) {
  if (envio.corrigeAId) { S.envios = [...S.envios, envio]; return; }
  const i = S.envios.findIndex((e) =>
    e.indicadorId === envio.indicadorId && e.operacionId === envio.operacionId &&
    e.periodo === envio.periodo && !e.corrigeAId);
  if (i === -1) S.envios = [...S.envios, envio];
  else { const copia = [...S.envios]; copia[i] = envio; S.envios = copia; }
}

      <button class="usuario" data-accion="rol" title="Cambiar de rol — sólo en la demostración">
        <span class="avatar">${esc(iniciales)}</span>
        <span class="chico fuerte">${esc(S.usuario.nombre)}</span>
        <span class="rol">${esc(S.usuario.rol)}</span>
        ${ico("chevron-down", 14)}
      </button>
    </header>`;
}

function lateral(via) {
  const entradas = visiblesEnMenu().map((r) => {
    const activa = r.via === "/" ? via === "/" : via.startsWith(r.via);
    return `<a href="#${r.via}" class="${activa ? "activa" : ""}">${ico(r.icono)} ${esc(r.etiqueta)}</a>`;
  }).join("");
  const nota = S.usuario.rol === "CAPTURA"
    ? "Sólo sus operaciones asignadas"
    : "Toda la división";
  return `<nav class="lateral ${S.menuAbierto ? "abierta" : ""}">${entradas}<p class="nota">${esc(nota)}</p></nav>`;
}

/** Quien coordina no captura: **su trabajo al abrir es el seguimiento**, así que la raíz lo
 *  es. Una pantalla cuyo contenido íntegro es un enlace a otra nunca gana sus píxeles. */
function pantalla(via, D) {
  if (via === "/") {
    return D.puedeVerTodo && S.usuario.rol !== "CAPTURA" ? seguimiento(D) : cola(D);
  }
  if (via.startsWith("/capturar/")) return matriz(via.slice("/capturar/".length), D);
  if (via === "/capturar") return buscadorDeOperaciones(D);
  if (via === "/seguimiento") return permiso(D.puedeVerTodo && S.usuario.rol !== "CAPTURA", "El seguimiento lo ven Coordinación, Administración y Dirección.", () => seguimiento(D));
  if (via === "/semanas") return permiso(D.puedeVerTodo && S.usuario.rol !== "CAPTURA", "La vista por semanas la ven Coordinación, Administración y Dirección.", () => semanas(D));
  if (via === "/analiticos") return permiso(S.usuario.puedeAnalizar, "Analíticos es un permiso que se enciende sobre el usuario, no un rol.", () => analiticos(D));
  if (via === "/admin") return permiso(["ADMIN", "COORDINACION"].includes(S.usuario.rol), "Administración la ven Administración y Coordinación.", () => admin(D));
  return `<h1>No existe esa pantalla</h1><p class="apagado">Vuelva a <a href="#/" class="fuerte">lo que hay que cargar</a>.</p>`;
}

function permiso(puede, motivo, pintarla) {
  if (puede) return pintarla();
  return `<h1>Fuera de su alcance</h1>
    <div class="aviso">${esc(motivo)} El alcance se aplica en el servidor, en cada consulta,
    nunca escondiendo botones.</div>`;
}

function seccion(titulo, acciones, contenido) {
  return `<section class="seccion">
    <div class="titulo"><h2>${titulo}</h2>${acciones ? `<span class="chico apagado">${acciones}</span>` : ""}</div>
    ${contenido}</section>`;
}
function vacio(titulo, mensaje) {
  return `<div class="vacio">${ico("circle-check-big", 24)}<h3>${esc(titulo)}</h3>
    <p class="chico apagado">${esc(mensaje)}</p></div>`;
}
function selector(id, valor, opciones, accion) {
  return `<select id="${id}" data-accion="${accion}">${opciones.map(([v, t]) =>
    `<option value="${esc(v)}" ${v === valor ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
}

/* ============================================================== 1 · la cola */

/** La raíz de quien captura. **No hay pantalla de inicio**: con una operación, la matriz
 *  directa; con varias, la cola — que es una lista, no un tablero. */
function cola(D) {
  if (D.mias.length === 0) {
    return `<h1>Capturar</h1>${vacio("No tiene ninguna operación asignada",
      "La asignación es lo único que esta plataforma administra y nace vacía.")}`;
  }
  if (D.mias.length === 1) return matriz(D.mias[0].id, D);

  const pendientes = L.operacionesPendientes(D.visibles, D.operacionesPorId, D.indicadoresPorId);
  const listas = D.mias.length - pendientes.length;
  const porcentaje = D.mias.length ? Math.round((listas / D.mias.length) * 100) : 0;
  const faltan = pendientes.reduce((t, r) => t + r.faltan, 0);

  const enCurso = L.periodoDe(L.ahora(), "SEMANAL");
  const entregados = S.envios.filter((e) => e.periodo === enCurso && e.estado === "ACEPTADO" && !e.corrigeAId).length;

  if (pendientes.length === 0) {
    return `<h1>Capturar</h1>${vacio(
      entregados > 0 ? `Listo. Sus ${D.mias.length} operaciones están al día` : "No queda nada pendiente",
      `Cuando abra el siguiente periodo, lo nuevo aparecerá aquí.`)}`;
  }

  const VISIBLES = 12;
  const filas = pendientes.slice(0, VISIBLES).map((p) => `
    <li style="display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.7rem 0;border-bottom:1px solid hsl(var(--border))">
      <div style="flex:1;min-width:14rem">
        <p class="trunca"><span class="fuerte">${esc(p.operacion.id)}</span>
          <span class="apagado">${esc(p.operacion.nombre)}</span></p>
        <p class="chico apagado trunca">faltan ${p.faltan} de ${p.deCuantos} · ${esc(L.etiquetaDePeriodo(p.periodo))}</p>
      </div>
      ${reloj(p.horas)}
      <a class="boton borde" href="#/capturar/${esc(p.operacion.id)}">Capturar</a>
    </li>`).join("");

  return `
    <h1>Lo que hay que cargar</h1>
    <div class="respuesta">
      <p>Le faltan <strong class="num">${pendientes.length}</strong> de ${D.mias.length} operaciones${
        listas > 0 ? `; lleva <strong class="num" style="color:hsl(var(--primary-foreground))">${listas}</strong> al día` : ""}.</p>
      <span class="barra" style="display:block;margin-top:.6rem"><i style="width:${porcentaje}%"></i></span>
    </div>
    ${seccion(`${n0(faltan)} envíos pendientes`, "del corte más próximo al más lejano",
      `<ul style="list-style:none;padding:0;margin:0;border-top:1px solid hsl(var(--border))">${filas}</ul>
       ${pendientes.length > VISIBLES
         ? `<p style="margin-top:.75rem"><a href="#/capturar" class="fuerte chico">Ver las ${pendientes.length - VISIBLES} restantes</a></p>` : ""}`)}`;
}

/* ============================================================== 2 · buscador */

function buscadorDeOperaciones(D) {
  const estados = L.estadoPorOperacion(D.visibles, D.indicadoresPorId);
  const texto = S.cap.busqueda.trim().toLowerCase();
  const filas = D.mias
    .filter((o) => !texto || `${o.id} ${o.nombre}`.toLowerCase().includes(texto))
    .map((o) => {
      const e = estados.get(o.id);
      return `<tr>
        <td><a href="#/capturar/${esc(o.id)}" class="fuerte">${esc(o.id)}</a>
          <p class="chico apagado trunca">${esc(o.nombre)}</p></td>
        <td class="chico">${esc(o.compania)}</td>
        <td class="der num">${e ? e.indicadores : 0}</td>
        <td class="der">${e && e.alDia
          ? `<span class="insignia i-completa">Al día</span>`
          : `<span class="insignia i-parcial num">${e ? e.vencidos : 0} vencidos</span>`}</td>
        <td class="der"><a class="boton borde chico" href="#/capturar/${esc(o.id)}">Abrir</a></td>
      </tr>`;
    }).join("");

  return `
    <h1>Sus operaciones</h1>
    <div class="respuesta"><p>Tiene <strong class="num">${D.mias.length}</strong> operaciones asignadas.</p></div>
    <div class="campo" style="max-width:22rem">
      <label for="buscar">Buscar</label>
      <input id="buscar" type="text" value="${esc(S.cap.busqueda)}" placeholder="Operación" data-accion="cap-buscar">
    </div>
    <div class="desliza"><table>
      <thead><tr><th>Operación</th><th>Compañía</th><th class="der">Indicadores</th><th class="der">Estado</th><th></th></tr></thead>
      <tbody>${filas || `<tr><td colspan="5" class="apagado">Ninguna operación coincide.</td></tr>`}</tbody>
    </table></div>`;
}

/* ============================================================== 3 · la matriz */

/** La matriz. **Un bloque por frecuencia**: una columna que dice «Semana 33» arriba y
 *  «agosto» abajo no es una tabla.
 *
 *  El bloque abierto se fija **al entrar** y no se recalcula: si se recalculara, terminar el
 *  corte semanal reemplazaría la tabla por la mensual justo al pulsar «Registrar». */
function matriz(operacionId, D) {
  const operacion = D.operacionesPorId.get(operacionId);
  if (!operacion) return `<h1>No existe esa operación</h1>`;

  const bloques = L.bloquesDeCaptura(operacionId, S.catalogo.cobertura, D.indicadoresPorId);
  if (bloques.length === 0) {
    return `<h1>${esc(operacion.id)}</h1>${vacio("A esta operación no se le pide nada", "No hay cobertura registrada.")}`;
  }

  // Se fija al entrar: el primer bloque que todavía deba algo.
  if (S.matriz.operacionId !== operacionId) {
    const conDeuda = bloques.find((b) => b.indicadores.some((i) =>
      !D.visibles.some((e) => e.indicadorId === i.id && e.operacionId === operacionId
        && e.periodo === b.periodo && e.estado !== "ESPERADO" && !e.corrigeAId)));
    const abierto = conDeuda || bloques[0];
    S.matriz = { operacionId, frecuencia: abierto.frecuencia, periodo: abierto.periodo,
                 textos: {}, tocados: new Set(), verEntregados: false, veredicto: null };
  }

  const bloque = bloques.find((b) => b.frecuencia === S.matriz.frecuencia) || bloques[0];
  const periodo = S.matriz.periodo || bloque.periodo;
  const primero = bloque.indicadores[0];
  const enVentana = L.estaEnVentana(periodo, primero);
  const renglones = construirRenglones(bloque, periodo, enVentana, operacionId, D);

  const pendientes = renglones.filter((r) => !r.entregado);
  const entregados = renglones.filter((r) => r.entregado);
  const listos = pendientes.filter((r) => r.completo).length;
  const aPintar = S.matriz.verEntregados ? renglones : pendientes;
  const siguiente = L.siguientePendiente(operacionId,
    L.operacionesPendientes(D.visibles, D.operacionesPorId, D.indicadoresPorId));

  const otros = bloques.filter((b) => b.frecuencia !== bloque.frecuencia);
  const alOcurrir = L.indicadoresDe(operacionId, S.catalogo.cobertura, D.indicadoresPorId)
    .filter((i) => i.frecuencia === "AL_OCURRIR");

  return `
    <p class="chico"><a href="#/" class="apagado">${ico("arrow-left", 13)} Volver a la cola</a></p>
    <h1>${esc(operacion.id)} <span class="apagado" style="font-weight:400">${esc(operacion.nombre)}</span></h1>
    <p class="chico apagado">${esc(operacion.compania)} · ${esc(operacion.unidadDeNegocio)}${
      operacion.sistemaDeclarado ? " · " + esc(operacion.sistemaDeclarado) : ` · <span class="escala">sin sistema declarado</span>`}</p>

    <div class="bloque">
      <div class="barra-titulo">
        <div style="display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap">
          <h2>${esc(bloque.rotulo)} ${esc(periodo.replace(/^\d{4}-W?/, ""))}</h2>
          <span class="chico apagado">${pendientes.length} de ${renglones.length} por cargar · corte ${esc(bloque.corte)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:.6rem">
          ${reloj(L.horasRestantes(periodo, primero))}
          ${selector("periodo", periodo, L.periodosElegibles(primero).map((p) => [p, L.etiquetaDePeriodo(p)]), "matriz-periodo")}
        </div>
      </div>

      <div class="desliza" style="border:none;border-radius:0">
        <table>
          <thead><tr>
            <th>Indicador</th>
            ${Array.from({ length: Math.max(...bloque.indicadores.map((i) => i.campos.length)) },
              () => `<th>Campo</th>`).join("")}
            <th class="der">Resultado</th>
          </tr></thead>
          <tbody>${aPintar.map((r) => renglonDeMatriz(r, Math.max(...bloque.indicadores.map((i) => i.campos.length)))).join("")}</tbody>
        </table>
      </div>

      ${S.matriz.veredicto ? `<div class="veredicto ${S.matriz.veredicto.tono}">${S.matriz.veredicto.texto}</div>` : ""}

      <div class="pie">
        <span class="chico apagado">
          ${entregados.length > 0
            ? `<button class="boton plano" data-accion="ver-entregados">${S.matriz.verEntregados ? "Ocultar" : "Ver"} los ${entregados.length} ya entregados</button>`
            : "Nada entregado todavía en este periodo"}
        </span>
        <span style="display:flex;gap:.6rem;align-items:center">
          ${siguiente && listos === 0
            ? `<a class="boton" href="#/capturar/${esc(siguiente.operacion.id)}">Seguir con ${esc(siguiente.operacion.id)}</a>`
            : ""}
          <button class="boton ${listos === 0 ? "borde" : ""}" data-accion="registrar" ${listos === 0 ? "disabled" : ""}>
            Registrar${listos > 0 ? ` ${listos}` : ""}
          </button>
          ${siguiente && listos > 0
            ? `<a class="boton borde" href="#/capturar/${esc(siguiente.operacion.id)}">Seguir con ${esc(siguiente.operacion.id)}</a>`
            : ""}
        </span>
      </div>
    </div>

    ${otros.length > 0 ? `<div class="rejilla dos">${otros.map((b) => `
      <button class="tarjeta" style="text-align:left;cursor:pointer;background:none" data-accion="cambiar-bloque" data-frecuencia="${b.frecuencia}">
        <h3>${esc(b.rotulo)} ${esc(b.periodo.replace(/^\d{4}-W?/, ""))}</h3>
        <p class="chico apagado">${b.indicadores.length} indicadores · corte ${esc(b.corte)} · ${esc(L.relojDe(b.horas))}</p>
      </button>`).join("")}</div>` : ""}

    ${alOcurrir.length > 0 ? `<div class="aviso">
      ${ico("triangle-alert", 14)} <strong>${alOcurrir.map((i) => i.id).join(" y ")}</strong> abren con el suceso, no con el
      calendario, así que no caben en una matriz de periodo y no generan esperados.
      Necesitan su propio formulario con fecha del hecho — es un hueco conocido, no un olvido.
    </div>` : ""}

    <p class="chico apagado">La carga por plantilla (<code>.xlsx</code>) existe en la
    plataforma y no en este archivo: leer Excel en el navegador exige otra librería.</p>`;
}

function construirRenglones(bloque, periodo, enVentana, operacionId, D) {
  return bloque.indicadores.map((indicador) => {
    const existente = D.visibles.find((e) =>
      e.indicadorId === indicador.id && e.operacionId === operacionId &&
      e.periodo === periodo && !e.corrigeAId);

    // Lo entregado deja de ser editable **cuando pasa el corte**, no al entregarse.
    const entregado = existente !== undefined && existente.estado !== "ESPERADO";
    const cerrado = entregado && !enVentana;

    const valores = {};
    for (const campo of indicador.campos) {
      const escrito = S.matriz.textos[campo.id];
      const previo = entregado ? existente.valores[campo.id] : undefined;
      valores[campo.id] = escrito !== undefined ? (escrito === "" ? undefined : Number(escrito)) : previo;
    }

    const anterior = D.visibles
      .filter((e) => e.indicadorId === indicador.id && e.operacionId === operacionId
        && e.estado === "ACEPTADO" && e.periodo < periodo)
      .sort((a, b) => b.periodo.localeCompare(a.periodo))[0];

    const contexto = {
      resultadoAnterior: anterior ? anterior.resultado : null,
      // Ajustar dentro de la ventana no es un segundo envío: es una corrección explícita.
      hayEnvioAceptado: !entregado && existente !== undefined && existente.estado === "ACEPTADO",
      remitenteAsignado: true,
      enVentana,
    };

    const erroresPorCampo = {};
    for (const campo of indicador.campos) {
      if (!S.matriz.tocados.has(campo.id)) continue;
      erroresPorCampo[campo.id] = L.evaluarCampo(indicador, campo.id, valores).map((f) => f.mensaje);
    }

    const completo = indicador.campos.every((c) => !c.obligatorio || valores[c.id] !== undefined);
    const sinErrores = Object.values(erroresPorCampo).every((l) => l.length === 0);

    return {
      indicador, valores, existente, cerrado, entregado,
      corrige: entregado && !cerrado ? existente : undefined,
      resultado: L.calcular(indicador, valores),
      completo, contexto, erroresPorCampo,
      escalaciones: completo && sinErrores
        ? L.evaluar(indicador, valores, contexto).incumplimientos.filter((f) => f.efecto === "ESCALA")
        : [],
    };
  });
}

function renglonDeMatriz(r, maximo) {
  const celdas = [];
  for (let i = 0; i < maximo; i++) {
    const campo = r.indicador.campos[i];
    if (!campo) { celdas.push("<td></td>"); continue; }
    const errores = r.erroresPorCampo[campo.id] || [];
    const valor = r.valores[campo.id];
    celdas.push(`<td>
      <label class="chico apagado" for="c_${campo.id}">${esc(campo.etiqueta)}</label>
      ${r.cerrado
        ? `<p class="num">${valor === undefined ? "—" : n0(valor)}</p>`
        : `<input id="c_${campo.id}" type="number" data-accion="matriz-campo" data-campo="${campo.id}"
             step="${campo.decimales ? "0.01" : "1"}" value="${valor === undefined ? "" : valor}"
             ${errores.length ? `aria-invalid="true" aria-describedby="e_${campo.id}"` : ""}>`}
      ${errores.length ? `<span class="error" id="e_${campo.id}">${esc(errores.join(" "))}</span>` : ""}
    </td>`);
  }

  // El resultado **no tiene dónde escribirse**: no es que esté deshabilitado, es que no
  // existe el campo. La invariante convertida en interfaz (§15.3).
  const valor = r.cerrado ? (r.existente ? r.existente.resultado : null) : r.resultado;
  const escalada = r.escalaciones[0];

  return `<tr ${r.cerrado ? 'class="apagado"' : ""}>
    <td>
      <span class="fuerte">${esc(r.indicador.id)}</span>
      <p class="chico apagado trunca" style="max-width:16rem">${esc(L.nombreCorto(r.indicador))}</p>
      ${r.entregado ? `<span class="insignia ${r.cerrado ? "i-gris" : "i-azul"} chico">${r.cerrado ? "cerrado" : "ajustable"}</span>` : ""}
      ${escalada ? `<span class="error escala">${ico("triangle-alert", 12)} ${esc(escalada.mensaje)}</span>` : ""}
    </td>
    ${celdas.join("")}
    <td class="der"><span class="resultado ${valor === null ? "sin" : ""}">${
      valor === null ? "—" : esc(L.formatearResultado(r.indicador.id, valor))}</span></td>
  </tr>`;
}

/** **No es todo o nada**: entra lo que pasa y se devuelve lo que no, con su mensaje. */
function registrarTodo(D) {
  const bloques = L.bloquesDeCaptura(S.matriz.operacionId, S.catalogo.cobertura, D.indicadoresPorId);
  const bloque = bloques.find((b) => b.frecuencia === S.matriz.frecuencia) || bloques[0];
  const periodo = S.matriz.periodo;
  const enVentana = L.estaEnVentana(periodo, bloque.indicadores[0]);
  const renglones = construirRenglones(bloque, periodo, enVentana, S.matriz.operacionId, D);

  let aceptados = 0, escalados = 0;
  const rechazados = [];
  const tocados = new Set(S.matriz.tocados);

  for (const r of renglones) {
    if (r.cerrado || !r.completo) continue;
    if (r.corrige && !r.indicador.campos.some((c) => S.matriz.tocados.has(c.id))) continue;

    const veredicto = L.evaluar(r.indicador, r.valores, r.contexto);

    if (veredicto.resultado === "RECHAZA") {
      // Rechazar culpa a quien captura: es reversible y **no escribe nada** (§7.2).
      rechazados.push(...veredicto.incumplimientos);
      for (const campo of r.indicador.campos) tocados.add(campo.id);
      continue;
    }

    registrar({
      id: `E-${r.indicador.id}-${periodo}-${S.envios.length + 1}`,
      indicadorId: r.indicador.id,
      operacionId: S.matriz.operacionId,
      periodo,
      // Escalar **retiene** y pide una decisión humana; no es un rechazo (§7.2).
      estado: veredicto.resultado === "ESCALA" ? "ESCALADO" : "ACEPTADO",
      resultado: veredicto.valorCalculado,
      recibidoEn: new Date().toISOString(),
      aTiempo: enVentana,
      canal: "FORMULARIO",
      capturadoPorId: S.usuario.id,
      corrigeAId: r.corrige ? r.corrige.id : null,
      valores: Object.fromEntries(Object.entries(r.valores).filter(([, v]) => v !== undefined)),
    });

    if (veredicto.resultado === "ESCALA") escalados++; else aceptados++;
  }

  S.matriz.tocados = tocados;
  S.matriz.textos = {};

  const partes = [
    aceptados > 0 && `<strong>${aceptados} aceptado${aceptados === 1 ? "" : "s"}</strong>`,
    escalados > 0 && `${escalados} escalado${escalados === 1 ? "" : "s"}`,
    rechazados.length > 0 && `${rechazados.length} rechazado${rechazados.length === 1 ? "" : "s"}`,
  ].filter(Boolean).join(" · ");

  if (rechazados.length > 0) {
    S.matriz.veredicto = { tono: "mal", texto: `${partes} — los rechazados quedan marcados arriba con su motivo. <span class="apagado">Nada de lo rechazado se escribió.</span>` };
  } else if (escalados > 0) {
    S.matriz.veredicto = { tono: "retiene", texto: `${partes} — lo escalado <strong>se retiene</strong> y sigue contando como pendiente.` };
  } else if (aceptados > 0) {
    S.matriz.veredicto = { tono: "ok", texto: `${partes} — escritos en la bitácora, con su nombre y su hora.` };
  } else {
    S.matriz.veredicto = { tono: "", texto: `<span class="apagado">No había nada que registrar: ningún renglón está completo todavía.</span>` };
  }
}

/* ============================================================== 4 · seguimiento */

/** La pantalla de coordinación. **Y es una tabla.** El agregado no dice a quién llamar. */
function seguimiento(D) {
  const POR_PAGINA = 20;
  const periodoDeCorte = L.periodoDe(L.ahora(), "SEMANAL");

  const porOperacion = new Map();
  for (const e of S.envios) {
    if (e.periodo !== periodoDeCorte || e.corrigeAId) continue;
    const fila = porOperacion.get(e.operacionId) || { cargados: 0, esperados: 0 };
    fila.esperados++;
    if (e.estado === "ACEPTADO") fila.cargados++;
    porOperacion.set(e.operacionId, fila);
  }

  const texto = S.seg.busqueda.trim().toLowerCase();
  let renglones = [...porOperacion.entries()].map(([id, conteo]) => {
    const operacion = D.operacionesPorId.get(id);
    const responsable = L.responsableDe(id, "", D.vigentes, D.usuariosPorId, operacion);
    return { id, operacion, ...conteo, responsable };
  }).filter((r) => r.operacion
    && (!S.seg.compania || r.operacion.compania === S.seg.compania)
    && (!texto || `${r.id} ${r.operacion.nombre}`.toLowerCase().includes(texto)));

  renglones.sort((a, b) => (a.cargados / a.esperados) - (b.cargados / b.esperados) || a.id.localeCompare(b.id));

  const cargados = renglones.reduce((t, r) => t + r.cargados, 0);
  const esperados = renglones.reduce((t, r) => t + r.esperados, 0);
  const cerradas = renglones.filter((r) => r.cargados >= r.esperados).length;
  const companias = [...new Set([...porOperacion.keys()].map((id) => D.operacionesPorId.get(id).compania))].sort();

  const paginas = Math.max(1, Math.ceil(renglones.length / POR_PAGINA));
  const pagina = Math.min(S.seg.pagina, paginas - 1);
  const enPantalla = renglones.slice(pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA);
  const vencido = L.ahora().getTime() > L.corteDe(periodoDeCorte, D.indicadoresPorId.get("L02")).getTime();

  const filas = enPantalla.map((r) => `<tr>
    <td><a href="#/capturar/${esc(r.id)}" class="fuerte">${esc(r.id)}</a>
      <p class="chico apagado trunca" style="max-width:15rem">${esc(r.operacion.nombre)}</p></td>
    <td class="chico">${esc(r.operacion.compania)}</td>
    <td class="chico ${r.responsable.origen === "hueco" ? "escala" : ""}">${esc(r.responsable.nombre)}</td>
    <td class="der">${insignia(r.cargados, r.esperados, vencido)}</td>
    <td><span class="barra"><i style="width:${Math.round(r.cargados / r.esperados * 100)}%"></i></span></td>
    <td class="der">${r.cargados >= r.esperados
      ? `<a class="boton plano chico" href="#/capturar/${esc(r.id)}">Editar</a>`
      : `<a class="boton borde chico" href="#/capturar/${esc(r.id)}">Completar</a>`}</td>
  </tr>`).join("");

  return `
    <h1>Seguimiento</h1>
    <div class="respuesta"><p>
      ${esc(L.etiquetaDePeriodo(periodoDeCorte))} va al
      <strong class="num">${esperados ? Math.round(cargados / esperados * 100) : 0}%</strong>.
      Faltan <strong class="num">${n0(esperados - cargados)}</strong> envíos en
      <strong class="num">${renglones.length - cerradas}</strong> operaciones, y
      <strong class="num">${cerradas}</strong> ya cerraron.
    </p></div>

    <div class="filtros">
      <div class="campo"><label for="f-compania">Compañía</label>
        ${selector("f-compania", S.seg.compania, [["", "Todas"], ...companias.map((c) => [c, c])], "seg-compania")}</div>
      <div class="campo"><label for="f-buscar">Buscar</label>
        <input id="f-buscar" type="text" value="${esc(S.seg.busqueda)}" placeholder="Operación" data-accion="seg-buscar"></div>
    </div>

    ${seccion("Entrega del periodo en curso",
      `${renglones.length} operaciones · corte ${esc(D.indicadoresPorId.get("L02").corte)}`,
      `<div class="desliza"><table>
        <thead><tr><th>Operación</th><th>Compañía</th><th>Responsable</th>
          <th class="der">Cargado</th><th style="width:9rem">Avance</th><th></th></tr></thead>
        <tbody>${filas || `<tr><td colspan="6" class="apagado">Ninguna operación coincide.</td></tr>`}</tbody>
      </table></div>
      ${paginas > 1 ? `<div style="display:flex;gap:.5rem;align-items:center;margin-top:.75rem">
        <button class="boton borde chico" data-accion="seg-pagina" data-a="${pagina - 1}" ${pagina === 0 ? "disabled" : ""}>Anterior</button>
        <span class="chico apagado num">${pagina + 1} de ${paginas}</span>
        <button class="boton borde chico" data-accion="seg-pagina" data-a="${pagina + 1}" ${pagina >= paginas - 1 ? "disabled" : ""}>Siguiente</button>
      </div>` : ""}`)}

    <p class="chico apagado">«Completar» lleva a capturar. La acción correcta sería
    <strong>recordar</strong>, y recordar es E2 — está registrado como deuda.</p>`;
}

/* ============================================================== 5 · por semana */

/** Lo mismo que el seguimiento, pero en el tiempo: es donde se distingue **quién falló una
 *  vez de quién falla siempre**, que es una conversación distinta. */
function semanas(D) {
  const todas = [...new Set(S.envios.map((e) => e.periodo))].filter((p) => p.includes("-W")).sort();
  const rango = todas.slice(-S.sem.cuantas);
  const enRango = new Set(rango);

  const porOperacion = new Map();
  for (const e of S.envios) {
    if (!enRango.has(e.periodo) || e.corrigeAId) continue;
    const filas = porOperacion.get(e.operacionId) || new Map();
    const celda = filas.get(e.periodo) || { cargados: 0, esperados: 0 };
    celda.esperados++;
    if (e.estado === "ACEPTADO") celda.cargados++;
    filas.set(e.periodo, celda);
    porOperacion.set(e.operacionId, filas);
  }

  const texto = S.sem.busqueda.trim().toLowerCase();
  const rejilla = [...porOperacion.entries()].map(([id, filas]) => {
    const operacion = D.operacionesPorId.get(id);
    // **Semanas malas, no semanas con cualquier hueco**, y con denominador: «2 de 8».
    const conDato = rango.filter((s) => filas.get(s) !== undefined).length;
    const malas = rango.filter((s) => {
      const c = filas.get(s);
      if (!c) return false;
      const sev = severidadDe(c.cargados, c.esperados);
      return sev === "parcial" || sev === "nada";
    }).length;
    return { id, operacion, filas, malas, conDato };
  }).filter((f) => f.operacion
    && (!S.sem.compania || f.operacion.compania === S.sem.compania)
    && (!texto || `${f.id} ${f.operacion.nombre}`.toLowerCase().includes(texto)));

  rejilla.sort((a, b) => {
    const suficiente = Math.ceil(rango.length / 2);
    const aT = a.conDato >= suficiente ? 1 : 0, bT = b.conDato >= suficiente ? 1 : 0;
    if (aT !== bT) return bT - aT;
    return (b.malas / (b.conDato || 1)) - (a.malas / (a.conDato || 1)) || b.malas - a.malas || a.id.localeCompare(b.id);
  });

  const conTodas = rejilla.filter((f) => f.malas === 0).length;
  const cronicas = rejilla.filter((f) => f.conDato > 0 && f.malas / f.conDato >= 0.5).length;
  const companias = [...new Set(rejilla.map((f) => f.operacion.compania))].sort();
  const TOPE = 40;

  const filas = rejilla.slice(0, TOPE).map((f) => `<tr>
    <td class="pegada"><a href="#/capturar/${esc(f.id)}" class="fuerte">${esc(f.id)}</a>
      <p class="chico apagado trunca" style="max-width:12rem">${esc(f.operacion.nombre)}</p></td>
    ${rango.map((s) => `<td class="cen" style="padding:.25rem">${marcaDeSemana(f.filas.get(s))}</td>`).join("")}
    <td class="der num ${f.malas > 0 ? "escala" : "apagado"}">${f.malas} de ${f.conDato}</td>
  </tr>`).join("");

  return `
    <h1>Por semana</h1>
    <div class="respuesta"><p>
      En las últimas ${rango.length} semanas, <strong class="num">${conTodas}</strong> de
      ${rejilla.length} operaciones cerraron todas${cronicas > 0
        ? ` y <strong class="num escala">${cronicas}</strong> fallaron de verdad en la mitad o más` : ""}.
    </p></div>

    <div class="filtros">
      <div class="campo"><label for="s-rango">Rango</label>
        ${selector("s-rango", String(S.sem.cuantas), [4, 8, 12].map((x) => [String(x), `Últimas ${x} semanas`]), "sem-rango")}</div>
      <div class="campo"><label for="s-compania">Compañía</label>
        ${selector("s-compania", S.sem.compania, [["", "Todas"], ...companias.map((c) => [c, c])], "sem-compania")}</div>
      <div class="campo"><label for="s-buscar">Buscar</label>
        <input id="s-buscar" type="text" value="${esc(S.sem.busqueda)}" placeholder="Operación" data-accion="sem-buscar"></div>
    </div>

    ${seccion("Entrega por semana", `${rejilla.length} operaciones · ${rango.length} semanas`,
      `<div class="desliza"><table>
        <thead><tr><th class="pegada">Operación</th>
          ${rango.map((s) => `<th class="cen">${esc(s.replace(/^\d{4}-W/, "S"))}</th>`).join("")}
          <th class="der">Semanas malas</th></tr></thead>
        <tbody>${filas || `<tr><td colspan="${rango.length + 2}" class="apagado">Nada que enseñar en este rango.</td></tr>`}</tbody>
      </table></div>
      ${rejilla.length > TOPE ? `<p class="chico apagado" style="margin-top:.5rem">Se muestran las ${TOPE} con peor proporción, de ${rejilla.length}. Filtre por compañía para ver el resto.</p>` : ""}`)}

    <p class="chico apagado">Cada celda es la fracción entregada de esa semana. Una celda
    vacía significa que a esa operación no se le pedía nada ese periodo — no que fallara.</p>`;
}

/* ============================================================== 6 · analíticos */

/** Ya no es seguimiento de entrega: mira **el número**.
 *  La agregación es ponderada — se suman los campos y se recalcula la fórmula. Promediar
 *  porcentajes entre operaciones da números creíbles y falsos. */
function analiticos(D) {
  const indicador = D.indicadoresPorId.get(S.ana.indicadorId) || D.indicadoresPorId.get("L02");
  const esSemanal = indicador.frecuencia === "SEMANAL";
  const todos = [...new Set(S.envios.filter((e) => e.indicadorId === indicador.id).map((e) => e.periodo))]
    .filter((p) => (esSemanal ? p.includes("-W") : !p.includes("-W"))).sort();

  const n = Math.min(S.ana.cuantas, Math.floor(todos.length / 2));
  const rango = todos.slice(-n);
  const anterior = todos.slice(-2 * n, -n);
  const recortado = n < S.ana.cuantas;

  // El eje: por compañía, por unidad de negocio o por clase de operación.
  const ejeDe = (o) => S.ana.eje === "compania" ? o.compania
    : S.ana.eje === "unidad" ? o.unidadDeNegocio : (o.clase || "sin clasificar");
  const grupos = [...new Set(S.catalogo.operaciones.map(ejeDe))].sort();
  const grupo = S.ana.grupo || grupos[0];
  const operacionesDelGrupo = new Set(S.catalogo.operaciones.filter((o) => ejeDe(o) === grupo).map((o) => o.id));

  const suyos = S.envios.filter((e) => e.indicadorId === indicador.id && operacionesDelGrupo.has(e.operacionId));
  const serie = L.serieAgregada(indicador, suyos, rango);
  const comparacion = L.comparar(indicador, suyos, rango, anterior);

  const conDato = serie.filter((p) => p.valor !== null);
  const flecha = comparacion.variacion === null || !L.seMovio(comparacion.variacion)
    ? `<span class="apagado">sin cambio</span>`
    : `<span class="${comparacion.esBuena ? "" : "escala"}" style="${comparacion.esBuena ? "color:hsl(var(--primary-foreground))" : ""}">
         ${comparacion.variacion > 0 ? "▲" : "▼"} ${n1(Math.abs(comparacion.variacion * 100))}%</span>`;

  const candidatos = S.catalogo.indicadores.filter((i) => i.frecuencia !== "AL_OCURRIR");

  return `
    <h1>Analíticos</h1>
    <div class="respuesta"><p>
      ${esc(L.nombreCorto(indicador))} en <strong>${esc(grupo)}</strong> va en
      <strong class="num">${esc(L.formatearAgregado(indicador, comparacion.ahora))}</strong>
      contra ${esc(L.formatearAgregado(indicador, comparacion.antes))} de las ${n} anteriores: ${flecha}.
    </p></div>

    <div class="filtros">
      <div class="campo"><label for="a-ind">Indicador</label>
        ${selector("a-ind", indicador.id, candidatos.map((i) => [i.id, `${i.id} · ${L.nombreCorto(i)}`]), "ana-ind")}</div>
      <div class="campo"><label for="a-eje">Agrupar por</label>
        ${selector("a-eje", S.ana.eje, [["compania", "Compañía"], ["unidad", "Unidad de negocio"], ["clase", "Clase de operación"]], "ana-eje")}</div>
      <div class="campo"><label for="a-grupo">Grupo</label>
        ${selector("a-grupo", grupo, grupos.map((g) => [g, g]), "ana-grupo")}</div>
      <div class="campo"><label for="a-rango">Rango</label>
        ${selector("a-rango", String(S.ana.cuantas), [4, 8, 12].map((x) => [String(x), `Últimos ${x} periodos`]), "ana-rango")}</div>
    </div>

    ${recortado ? `<div class="aviso">Sólo hay historia para ${n} periodos comparables, así que
      se comparan ${n} contra ${n}. Comparar rangos de distinta longitud diría que todo bajó, y
      sólo por tener más datos.</div>` : ""}

    ${seccion(`${esc(indicador.id)} · ${esc(L.nombreCorto(indicador))}`,
      `${esc(indicador.tipo)} · ${esc(indicador.sentido.replace(/_/g, " ").toLowerCase())} · agregación ${esc(L.agregacionDe(indicador))}`,
      grafica(serie, indicador))}

    ${seccion("Cómo se combinan las operaciones", "el error que no se nota", `
      <div class="rejilla dos">
        <div class="tarjeta">
          <h3>Ponderado — el número verdadero</h3>
          <p class="num" style="font-size:1.5rem;font-weight:700">${esc(L.formatearAgregado(indicador, comparacion.ahora))}</p>
          <p class="chico apagado">Se suman los campos capturados de las ${operacionesDelGrupo.size}
          operaciones y se vuelve a aplicar la fórmula. Se puede porque el resultado se calcula
          y nunca se captura.</p>
        </div>
        <div class="tarjeta">
          <h3>Promedio simple — lo que hace una hoja</h3>
          <p class="num escala" style="font-size:1.5rem;font-weight:700">${esc(promedioSimple(indicador, suyos, rango))}</p>
          <p class="chico apagado">Sumar los porcentajes y dividir entre el número de
          operaciones. 99% sobre 100 unidades y 50% sobre 10,000 no pesan lo mismo.</p>
        </div>
      </div>`)}

    <div class="desliza"><table>
      <thead><tr><th>Periodo</th><th class="der">Valor</th><th class="der">Operaciones que aportaron</th></tr></thead>
      <tbody>${serie.map((p) => `<tr>
        <td>${esc(L.etiquetaDePeriodo(p.periodo))}</td>
        <td class="der num">${p.valor === null ? `<span class="apagado">—</span>` : esc(L.formatearAgregado(indicador, p.valor))}</td>
        <td class="der num apagado">${p.operaciones}</td>
      </tr>`).join("")}</tbody>
    </table></div>

    <p class="chico apagado">Un punto de una sola operación no es comparable con uno de
    sesenta: por eso la última columna existe. ${conDato.length} de ${serie.length} periodos
    tienen dato.</p>`;
}

/** El promedio simple, calculado sólo para poder enseñar que está mal. */
function promedioSimple(indicador, envios, rango) {
  const enRango = new Set(rango);
  const valores = envios
    .filter((e) => enRango.has(e.periodo) && e.estado === "ACEPTADO" && e.resultado !== null)
    .map((e) => e.resultado);
  if (valores.length === 0) return "—";
  return L.formatearAgregado(indicador, valores.reduce((a, b) => a + b, 0) / valores.length);
}

/** Una serie en SVG. Sin recharts: son cuatro líneas y un `path`. */
function grafica(serie, indicador) {
  const puntos = serie.map((p, i) => ({ ...p, i })).filter((p) => p.valor !== null);
  if (puntos.length < 2) return vacio("No hay serie que dibujar", "Hacen falta al menos dos periodos con dato.");

  const A = 640, H = 200, m = { i: 48, d: 12, a: 12, b: 24 };
  const valores = puntos.map((p) => p.valor);
  let min = Math.min(...valores), max = Math.max(...valores);
  if (min === max) { min -= Math.abs(min) * 0.1 || 1; max += Math.abs(max) * 0.1 || 1; }
  const x = (i) => m.i + (i / Math.max(1, serie.length - 1)) * (A - m.i - m.d);
  const y = (v) => m.a + (1 - (v - min) / (max - min)) * (H - m.a - m.b);

  const d = puntos.map((p, k) => `${k === 0 ? "M" : "L"}${x(p.i).toFixed(1)},${y(p.valor).toFixed(1)}`).join(" ");
  const marcas = puntos.map((p) => `<circle class="punto" cx="${x(p.i).toFixed(1)}" cy="${y(p.valor).toFixed(1)}" r="3"><title>${esc(L.etiquetaDePeriodo(p.periodo))}: ${esc(L.formatearAgregado(indicador, p.valor))} · ${p.operaciones} operaciones</title></circle>`).join("");
  const etiquetasX = serie.map((p, i) => i % Math.ceil(serie.length / 6) === 0
    ? `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(p.periodo.replace(/^\d{4}-W?/, ""))}</text>` : "").join("");

  return `<div class="tarjeta"><svg class="grafica" viewBox="0 0 ${A} ${H}" preserveAspectRatio="none" role="img">
    <line class="eje" x1="${m.i}" y1="${m.a}" x2="${m.i}" y2="${H - m.b}"/>
    <line class="eje" x1="${m.i}" y1="${H - m.b}" x2="${A - m.d}" y2="${H - m.b}"/>
    <text x="${m.i - 6}" y="${m.a + 4}" text-anchor="end">${esc(L.formatearAgregado(indicador, max))}</text>
    <text x="${m.i - 6}" y="${H - m.b}" text-anchor="end">${esc(L.formatearAgregado(indicador, min))}</text>
    <path class="linea" d="${d}"/>${marcas}${etiquetasX}
  </svg></div>`;
}

/* ============================================================== 7 · administración */

const PESTANAS = [
  ["companias", "División y compañías"],
  ["operaciones", "Operaciones"],
  ["indicadores", "Indicadores"],
  ["grupos", "Grupos"],
  ["malla", "Asignación y carga"],
];

function panelOperaciones(D) {
  const sinClase = S.catalogo.operaciones.filter((o) => o.clase === null);
  const sinSistema = S.catalogo.operaciones.filter((o) => o.sistemaDeclarado === null);
  const sinContacto = S.catalogo.operaciones.filter((o) => !o.contactoCapturaNombre);
  const CLASES = ["ALMACEN", "CROSSDOCK", "OFICINA", "PAQUETERIA", "ULTIMA_MILLA", "TRANSPORTE", "DISTRIBUCION"];

  const lote = S.admin.companiaLote;
  const candidatas = sinClase.filter((o) => !lote || o.companiaId === lote);

  return `
    <div class="respuesta"><p>
      <strong class="num escala">${sinClase.length}</strong> operaciones sin clasificar,
      <strong class="num escala">${sinSistema.length}</strong> sin sistema declarado y
      <strong class="num escala">${sinContacto.length}</strong> sin quien capture.
    </p></div>

    <div class="aviso">${ico("triangle-alert", 14)} <strong>La clase nace en nulo en las
      ${S.catalogo.operaciones.length}</strong>, y así se queda hasta que alguien la cierre:
      133 de los nombres no dan ninguna pista y adivinarlas sería inventar. Se publica el
      hueco en vez de rellenarlo.</div>

    ${seccion("Cerrar la clase por lote", `${candidatas.length} candidatas`, `
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end">
        <div class="campo"><label for="lote-compania">Compañía</label>
          ${selector("lote-compania", lote, [["", "Todas"], ...S.catalogo.companias.map((c) => [c.id, c.nombre])], "lote-compania")}</div>
        <div class="campo"><label for="lote-clase">Clase</label>
          ${selector("lote-clase", S.admin.claseLote, CLASES.map((c) => [c, c.replace(/_/g, " ")]), "lote-clase")}</div>
        <button class="boton" data-accion="clasificar-lote" ${candidatas.length === 0 ? "disabled" : ""}>
          Clasificar ${candidatas.length}</button>
      </div>`)}

    ${seccion("Operaciones", `${S.catalogo.operaciones.length} en total`, `
      <div class="desliza"><table>
        <thead><tr><th>Operación</th><th>Compañía</th><th>Clase</th><th>Sistema</th><th>Contacto de captura</th><th class="der">Estado</th><th></th></tr></thead>
        <tbody>${S.catalogo.operaciones.slice(0, 60).map((o) => `<tr>
          <td><span class="fuerte">${esc(o.id)}</span><p class="chico apagado trunca" style="max-width:12rem">${esc(o.nombre)}</p></td>
          <td class="chico">${esc(o.compania)}</td>
          <td class="chico">${o.clase ? esc(o.clase.replace(/_/g, " ")) : `<span class="escala">sin clasificar</span>`}</td>
          <td class="chico">${o.sistemaDeclarado ? esc(o.sistemaDeclarado) : `<span class="escala">sin declarar</span>`}</td>
          <td class="chico">${o.contactoCapturaNombre ? esc(o.contactoCapturaNombre.split(" ·")[0]) : `<span class="escala">sin quien capture</span>`}</td>
          <td class="der">${o.activo ? `<span class="insignia i-completa">Activa</span>` : `<span class="insignia i-gris">Inactiva</span>`}</td>
          <td class="der"><button class="boton plano chico" data-accion="alternar-operacion" data-a="${esc(o.id)}">${o.activo ? "Dar de baja" : "Reactivar"}</button></td>
        </tr>`).join("")}</tbody>
      </table></div>
      <p class="chico apagado" style="margin-top:.5rem">Se muestran 60 de ${S.catalogo.operaciones.length}.</p>`)}`;
}

function panelIndicadores(D) {
  const porTipo = {};
  for (const i of S.catalogo.indicadores) porTipo[i.tipo] = (porTipo[i.tipo] || 0) + 1;

  return `
    <div class="respuesta"><p>
      <strong class="num">${S.catalogo.indicadores.length}</strong> indicadores con
      <strong class="num">${S.catalogo.indicadores.reduce((t, i) => t + i.campos.length, 0)}</strong> campos y
      <strong class="num">${S.catalogo.indicadores.reduce((t, i) => t + i.reglas.length, 0)}</strong> reglas.
      La cobertura son <strong class="num">${n0(Object.values(S.catalogo.cobertura).reduce((t, l) => t + l.length, 0))}</strong> renglones.
    </p></div>

    <div class="aviso">${ico("triangle-alert", 14)} <strong>Las 23 fórmulas están escritas a
      mano y sin firmar.</strong> El campo <code>formula</code> de la semilla es prosa, no una
      expresión ejecutable. L12 es la urgente: divide entre el promedio del headcount de este
      periodo y el anterior, y ese dato no es un campo capturado.</div>

    ${seccion("Indicadores", Object.entries(porTipo).map(([t, n]) => `${t} ${n}`).join(" · "), `
      <div class="desliza"><table>
        <thead><tr><th>Indicador</th><th>Dominio</th><th>Frecuencia</th><th>Tipo</th><th>Sentido</th>
          <th class="der">Campos</th><th class="der">Reglas</th><th class="der">Cobertura</th><th class="der">Estado</th><th></th></tr></thead>
        <tbody>${S.catalogo.indicadores.map((i) => `<tr>
          <td><span class="fuerte">${esc(i.id)}</span><p class="chico apagado trunca" style="max-width:14rem">${esc(L.nombreCorto(i))}</p></td>
          <td class="chico">${esc(i.dominio)}</td>
          <td class="chico">${esc(i.frecuencia.toLowerCase().replace("_", " "))}</td>
          <td class="chico">${esc(i.tipo)}</td>
          <td class="chico">${esc(i.sentido.replace(/_/g, " ").toLowerCase())}</td>
          <td class="der num">${i.campos.length}</td>
          <td class="der num">${i.reglas.length}</td>
          <td class="der num">${(S.catalogo.cobertura[i.id] || []).length}</td>
          <td class="der">${i.activo ? `<span class="insignia i-completa">Activo</span>` : `<span class="insignia i-gris">Retirado</span>`}</td>
          <td class="der"><button class="boton plano chico" data-accion="alternar-indicador" data-a="${esc(i.id)}">${i.activo ? "Retirar" : "Reactivar"}</button></td>
        </tr>`).join("")}</tbody>
      </table></div>`)}

    <p class="chico apagado">Sin <code>tipo</code>, un NPS se pinta «45.58%». Sin
    <code>sentido</code>, una subida de la rotación se colorea como buena noticia. La
    taxonomía se derivó de los datos y <strong>también necesita firma</strong>.</p>`;
}

function panelGrupos(D) {
  return `
    <div class="respuesta"><p>
      <strong class="num">${S.catalogo.grupos.length}</strong> grupos de indicadores. Un grupo
      más una compañía es un ámbito de asignación — y es lo que bajó la malla de 2,453
      renglones a ${D.vigentes.length}.
    </p></div>

    ${seccion("Grupos", "opcionalmente atados a una compañía", `
      <div style="display:flex;gap:.5rem;margin-bottom:.75rem;max-width:32rem">
        <input type="text" id="nuevo-grupo" placeholder="Nombre del grupo">
        <button class="boton" data-accion="crear-grupo">${ico("plus", 14)} Crear</button>
      </div>
      <div class="desliza"><table>
        <thead><tr><th>Grupo</th><th>Compañía</th><th class="der">Indicadores</th><th>Cuáles</th><th></th></tr></thead>
        <tbody>${S.catalogo.grupos.map((g) => `<tr>
          <td class="fuerte">${esc(g.nombre)}</td>
          <td class="chico">${g.companiaId ? esc((D.companiasPorId.get(g.companiaId) || {}).nombre || g.companiaId) : `<span class="apagado">toda la división</span>`}</td>
          <td class="der num">${g.indicadores.length}</td>
          <td class="chico apagado trunca" style="max-width:16rem">${esc(g.indicadores.join(" "))}</td>
          <td class="der"><button class="boton peligro chico" data-accion="borrar-grupo" data-a="${esc(g.id)}">Borrar</button></td>
        </tr>`).join("")}</tbody>
      </table></div>`)}

    <p class="chico apagado"><strong>La cobertura manda sobre el grupo</strong>: un grupo puede
    nombrar un indicador que a una operación no se le pide, y ahí no hay nada que capturar.</p>`;
}

/** La pantalla que hace visible la concentración. **Sin ella nada impide que vuelva.** */
function panelMalla(D) {
  const semanal = S.catalogo.indicadores.filter((i) => i.frecuencia === "SEMANAL").map((i) => i.id);

  const carga = DATOS.usuarios.filter((u) => u.activo).map((u) => {
    const suyas = D.vigentes.filter((a) => a.usuarioId === u.id);
    const operaciones = L.operacionesDe(suyas, D.operacionesPorId);
    let envios = 0;
    for (const op of operaciones) {
      for (const indId of semanal) {
        if ((S.catalogo.cobertura[indId] || []).includes(op.id)) envios++;
      }
    }
    return { usuario: u, ambitos: suyas.length, operaciones: operaciones.length, envios };
  }).sort((a, b) => b.envios - a.envios);

  const tope = Math.max(...carga.map((c) => c.envios), 1);
  const sinResponsable = S.catalogo.operaciones.filter((o) => o.activo
    && !D.vigentes.some((a) => a.ambito === "OPERACION" ? a.operacionId === o.id : a.companiaId === o.companiaId));

  // Aviso desde el tercer responsable: se permite, no se bloquea.
  const porOperacion = new Map();
  for (const a of D.vigentes.filter((x) => x.ambito === "OPERACION")) {
    porOperacion.set(a.operacionId, (porOperacion.get(a.operacionId) || 0) + 1);
  }
  const conMuchos = [...porOperacion.entries()].filter(([, n]) => n >= 3);

  return `
    <div class="respuesta"><p>
      La malla son <strong class="num">${D.vigentes.length}</strong> ámbitos vigentes para
      <strong class="num">${carga.filter((c) => c.ambitos > 0).length}</strong> personas.
      La más cargada debe <strong class="num escala">${n0(carga[0].envios)}</strong> envíos por semana.
    </p></div>

    ${seccion("Carga por persona", "envíos semanales que le tocan", `
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Rol</th><th class="der">Ámbitos</th><th class="der">Operaciones</th>
          <th class="der">Envíos por semana</th><th style="width:9rem"></th></tr></thead>
        <tbody>${carga.map((c) => `<tr>
          <td class="fuerte">${esc(c.usuario.nombre)}</td>
          <td class="chico apagado">${esc(c.usuario.rol)}</td>
          <td class="der num">${c.ambitos}</td>
          <td class="der num">${c.operaciones}</td>
          <td class="der num ${c.envios > 200 ? "escala fuerte" : ""}">${n0(c.envios)}${c.envios > 200 ? " ⚠" : ""}</td>
          <td><span class="barra"><i style="width:${Math.round(c.envios / tope * 100)}%;${c.envios > 200 ? "background:hsl(var(--destructive-warm))" : ""}"></i></span></td>
        </tr>`).join("")}</tbody>
      </table></div>`)}

    ${seccion("Repartir una operación", "el ámbito, no la combinación", `
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end">
        <div class="campo" style="min-width:14rem"><label for="asignar-a">Persona</label>
          ${selector("asignar-a", S.admin.asignarA, [["", "Elija a quién"],
            ...DATOS.usuarios.filter((u) => u.activo && u.rol !== "LECTURA").map((u) => [u.id, u.nombre])], "asignar-a")}</div>
        <div class="campo" style="min-width:14rem"><label for="asignar-op">Operación</label>
          ${selector("asignar-op", "", [["", "Elija una operación"],
            ...S.catalogo.operaciones.filter((o) => o.activo).slice(0, 80).map((o) => [o.id, `${o.id} · ${o.nombre}`])], "nada")}</div>
        <button class="boton" data-accion="asignar">Asignar</button>
      </div>
      ${conMuchos.length > 0 ? `<div class="aviso" style="margin-top:.75rem">
        ${ico("triangle-alert", 14)} <strong>${conMuchos.length} operaciones tienen tres o más
        responsables.</strong> Se permite y se guarda — sólo se avisa, no se bloquea.</div>` : ""}`)}

    ${seccion("Huecos de la malla", `${sinResponsable.length} operaciones activas sin responsable`,
      sinResponsable.length === 0
        ? vacio("No hay huecos en la malla", "Todas las operaciones activas tienen a alguien.")
        : `<div class="desliza"><table>
            <thead><tr><th>Operación</th><th>Compañía</th><th>Contacto que el análisis conoce</th></tr></thead>
            <tbody>${sinResponsable.slice(0, 30).map((o) => `<tr>
              <td><span class="fuerte">${esc(o.id)}</span> <span class="chico apagado">${esc(o.nombre)}</span></td>
              <td class="chico">${esc(o.compania)}</td>
              <td class="chico">${o.contactoCapturaNombre
                ? esc(o.contactoCapturaNombre.split(" ·")[0]) + ` <span class="apagado">(contacto, no asignación)</span>`
                : `<span class="escala">sin quien capture</span>`}</td>
            </tr>`).join("")}</tbody>
          </table></div>`)}

    ${seccion("Malla vigente", `${D.vigentes.length} ámbitos`, `
      <div class="desliza"><table>
        <thead><tr><th>Persona</th><th>Ámbito</th><th>Sobre</th><th></th></tr></thead>
        <tbody>${D.vigentes.slice(0, 40).map((a) => {
          const u = D.usuariosPorId.get(a.usuarioId);
          const sobre = a.ambito === "OPERACION"
            ? `${a.operacionId} · ${(D.operacionesPorId.get(a.operacionId) || {}).nombre || ""}`
            : `${(S.catalogo.grupos.find((g) => g.id === a.grupoId) || {}).nombre || a.grupoId} en ${(D.companiasPorId.get(a.companiaId) || {}).nombre || a.companiaId}`;
          return `<tr>
            <td class="fuerte">${esc(u ? u.nombre : a.usuarioId)}</td>
            <td><span class="insignia i-azul">${esc(a.ambito)}</span></td>
            <td class="chico trunca" style="max-width:20rem">${esc(sobre)}</td>
            <td class="der"><button class="boton plano chico" data-accion="retirar" data-a="${esc(a.id)}">Retirar</button></td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>
      ${D.vigentes.length > 40 ? `<p class="chico apagado" style="margin-top:.5rem">Se muestran 40 de ${D.vigentes.length}.</p>` : ""}`)}

    <p class="chico apagado">Retirar pone <code>hasta</code> con fecha; <strong>nunca
    borra</strong>, para que la bitácora vieja siga explicándose sola.</p>`;
}

/* ============================================================== sucesos */

function valorDe(id) {
  const nodo = document.getElementById(id);
  return nodo ? nodo.value : "";
}

document.addEventListener("click", (evento) => {
  const nodo = evento.target.closest("[data-accion]");
  if (!nodo) return;
  const accion = nodo.dataset.accion;
  const a = nodo.dataset.a;
  const D = derivar();

  switch (accion) {
    case "menu": S.menuAbierto = !S.menuAbierto; break;
    case "rol": {
      // El selector de rol es de la demostración: en la plataforma es el menú de usuario.
      const roles = ["CAPTURA", "COORDINACION", "ADMIN", "LECTURA"];
      const siguiente = roles[(roles.indexOf(S.usuario.rol) + 1) % roles.length];
      const usuario = DATOS.usuarios.find((u) => u.rol === siguiente);
      if (usuario) { S.usuario = usuario; S.matriz.operacionId = null; ir("/"); }
      break;
    }
    case "ver-entregados": S.matriz.verEntregados = !S.matriz.verEntregados; break;
    case "cambiar-bloque": {
      const bloques = L.bloquesDeCaptura(S.matriz.operacionId, S.catalogo.cobertura, D.indicadoresPorId);
      const bloque = bloques.find((b) => b.frecuencia === nodo.dataset.frecuencia);
      if (bloque) {
        S.matriz.frecuencia = bloque.frecuencia;
        S.matriz.periodo = bloque.periodo;
        S.matriz.textos = {}; S.matriz.tocados = new Set(); S.matriz.veredicto = null;
      }
      break;
    }
    case "registrar": registrarTodo(D); break;
    case "seg-pagina": S.seg.pagina = Number(a); break;
    case "admin-pestana": S.admin.pestana = a; break;

    case "crear-division": {
      const nombre = valorDe("nueva-division").trim();
      if (nombre) S.catalogo = L.crearDivision(S.catalogo, nombre);
      break;
    }
    case "alternar-division": S.catalogo = L.alternarDivision(S.catalogo, a); break;
    case "crear-compania": {
      const nombre = valorDe("nueva-compania").trim();
      const divisionId = valorDe("division-de") || S.catalogo.divisiones[0].id;
      if (nombre) S.catalogo = L.crearCompania(S.catalogo, nombre, divisionId);
      break;
    }
    case "alternar-compania": S.catalogo = L.alternarCompania(S.catalogo, a); break;
    case "clasificar-lote": {
      const ids = S.catalogo.operaciones
        .filter((o) => o.clase === null && (!S.admin.companiaLote || o.companiaId === S.admin.companiaLote))
        .map((o) => o.id);
      S.catalogo = L.clasificarOperaciones(S.catalogo, ids, S.admin.claseLote);
      break;
    }
    case "alternar-operacion": S.catalogo = L.alternarOperacion(S.catalogo, a); break;
    case "alternar-indicador": S.catalogo = L.alternarIndicador(S.catalogo, a); break;
    case "crear-grupo": {
      const nombre = valorDe("nuevo-grupo").trim();
      if (nombre) S.catalogo = L.crearGrupo(S.catalogo, nombre, null, []);
      break;
    }
    case "borrar-grupo": S.catalogo = L.borrarGrupo(S.catalogo, a); break;
    case "asignar": {
      const usuarioId = valorDe("asignar-a");
      const operacionId = valorDe("asignar-op");
      if (!usuarioId || !operacionId) break;
      const llave = (x) => `${x.usuarioId}|OPERACION|${x.operacionId}`;
      const nueva = { id: `A-OP-${operacionId}-${usuarioId}`, usuarioId, ambito: "OPERACION",
                      operacionId, grupoId: null, companiaId: null, hasta: null };
      const ya = new Set(S.asignaciones.filter((x) => x.hasta === null && x.ambito === "OPERACION").map(llave));
      if (!ya.has(llave(nueva))) S.asignaciones = [...S.asignaciones, nueva];
      break;
    }
    case "retirar":
      // Se retira poniendo fecha, **nunca borrando** (§5.2.3).
      S.asignaciones = S.asignaciones.map((x) => x.id === a ? { ...x, hasta: new Date().toISOString() } : x);
      break;
    default: return;
  }

  if (accion !== "rol") { evento.preventDefault(); pintar(); }
});

document.addEventListener("input", (evento) => {
  const nodo = evento.target.closest("[data-accion]");
  if (!nodo) return;

  switch (nodo.dataset.accion) {
    case "matriz-campo": {
      S.matriz.textos[nodo.dataset.campo] = nodo.value;
      S.matriz.tocados.add(nodo.dataset.campo);
      const foco = nodo.id, cursor = nodo.value.length;
      pintar();
      const otra = document.getElementById(foco);
      if (otra) { otra.focus(); try { otra.setSelectionRange(cursor, cursor); } catch (e) {} }
      return;
    }
    case "cap-buscar": S.cap.busqueda = nodo.value; break;
    case "seg-buscar": S.seg.busqueda = nodo.value; S.seg.pagina = 0; break;
    case "sem-buscar": S.sem.busqueda = nodo.value; break;
    default: return;
  }
  const foco = nodo.id, cursor = nodo.value.length;
  pintar();
  const otra = document.getElementById(foco);
  if (otra) { otra.focus(); try { otra.setSelectionRange(cursor, cursor); } catch (e) {} }
});

document.addEventListener("change", (evento) => {
  const nodo = evento.target.closest("[data-accion]");
  if (!nodo) return;
  switch (nodo.dataset.accion) {
    case "matriz-periodo":
      S.matriz.periodo = nodo.value;
      S.matriz.textos = {}; S.matriz.tocados = new Set(); S.matriz.veredicto = null;
      break;
    case "seg-compania": S.seg.compania = nodo.value; S.seg.pagina = 0; break;
    case "sem-rango": S.sem.cuantas = Number(nodo.value); break;
    case "sem-compania": S.sem.compania = nodo.value; break;
    case "ana-ind": S.ana.indicadorId = nodo.value; break;
    case "ana-eje": S.ana.eje = nodo.value; S.ana.grupo = ""; break;
    case "ana-grupo": S.ana.grupo = nodo.value; break;
    case "ana-rango": S.ana.cuantas = Number(nodo.value); break;
    case "lote-compania": S.admin.companiaLote = nodo.value; break;
    case "lote-clase": S.admin.claseLote = nodo.value; break;
    case "asignar-a": S.admin.asignarA = nodo.value; return;
    default: return;
  }
  pintar();
});

window.addEventListener("hashchange", () => { S.menuAbierto = false; pintar(); });

/* ============================================================== arranque */

// Si el rol en curso no puede ver la ruta, se cae a la suya. La navegación no es la
// autorización: en la plataforma real el alcance se aplica en el servidor.
if (!location.hash) location.hash = "#/";
pintar();

</script>
</body>
</html>
